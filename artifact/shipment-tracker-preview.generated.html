ords = f ? (await window.shipAPI.loadRecords(f.folderPath)).filter(r=>r.mode===s.targetMode) : [];\n    render();\n  };\n  const modeSel = document.getElementById(\"assignModeSelect\");\n  if(modeSel) modeSel.onchange = async () => {\n    s.targetMode = modeSel.value;\n    s.itemKeys = []; s.result = null;\n    const f = assignModalTargetFolder(s);\n    s.eventRecords = f ? (await window.shipAPI.loadRecords(f.folderPath)).filter(r=>r.mode===s.targetMode) : [];\n    render();\n  };\n  document.querySelectorAll(\"[data-item-key-opt]\").forEach(cb => cb.onchange = () => {\n    const k = cb.dataset.itemKeyOpt;\n    if(cb.checked){ if(!s.itemKeys.includes(k)) s.itemKeys.push(k); } else { s.itemKeys = s.itemKeys.filter(x=>x!==k); }\n    s.result = null;\n    render();\n  });\n  const previewBtn = document.getElementById(\"previewAssignBtn\");\n  if(previewBtn) previewBtn.onclick = async () => {\n    const f = assignModalTargetFolder(s);\n    s.result = await window.shipAPI.assignStampsHistoryDates(s.dates, f.folderPath, s.targetMode, s.itemKeys, false);\n    render();\n  };\n  const applyBtn = document.getElementById(\"applyAssignBtn\");\n  if(applyBtn) applyBtn.onclick = async () => {\n    const f = assignModalTargetFolder(s);\n    const applied = await window.shipAPI.assignStampsHistoryDate(s.date, f.folderPath, s.targetMode, s.itemKeys, true);\n    s.result = applied;\n    stampsHistoryDateGroups = await window.shipAPI.stampsHistoryDateGroups();\n    if(currentEvent && currentEvent.folderPath===f.folderPath){ await refreshEventData(); }\n    alert(`Applied ${applied.appliedCount} label(s) to ${esc(f.name)}. ${applied.unmatched.length} unmatched row(s) logged as MATCH REVIEW REQUIRED.`);\n    render();\n  };\n  const exportBtn = document.getElementById(\"exportMatchReportBtn\");\n  if(exportBtn) exportBtn.onclick = async () => {\n    const f = assignModalTargetFolder(s);\n    const opts = itemKeyOptions(s.eventRecords);\n    const itemNames = s.itemKeys.map(k => (opts.find(o=>o.key===k)||{}).name || k);\n    await window.shipAPI.exportTrackingMatchReportCsv(f.folderPath, s.result, itemNames);\n  };\n}\n\n/* ---- Bulk notify confirm ---- */\nfunction renderNotifyModal(){\n  const s = modalState;\n  return `<div class=\"modal-overlay\" id=\"modalOverlay\"><div class=\"modal\">\n    <div class=\"modal-head\"><div><h3>Notify selected runners</h3><p>${s.list.length} with a usable email will be emailed; ${s.skipped.length} skipped (no email)</p></div><button class=\"modal-close\" id=\"modalCloseX\">×</button></div>\n    <div class=\"modal-body\">\n      <div style=\"overflow-x:auto;\"><table class=\"rt\"><thead><tr><th>Name</th><th>Email</th><th>Items</th></tr></thead><tbody>\n      ${s.list.map(r=>`<tr><td>${esc(r.firstName)} ${esc(r.lastName)}</td><td>${esc(r.email)}</td><td>${r.items.filter(i=>i.trackingNumber).map(i=>esc(i.name)).join(\", \")}</td></tr>`).join(\"\")}\n      </tbody></table></div>\n    </div>\n    <div class=\"modal-foot\"><button class=\"btn ghost small\" id=\"modalCloseBtn2\">Cancel</button><button class=\"btn primary small\" id=\"notifyConfirmBtn\">Send ${s.list.length} email(s)</button></div>\n  </div></div>`;\n}\n\n/* ---- Bulk: apply one tracking number, typed by hand, to a selected group ---- */\n// For a bulk drop-off etc. where one real tracking number covers a whole\n// selected group's item(s) — a real number is required, no fallback to\n// marking things shipped without one.\nfunction renderBulkManualShipModal(){\n  const s = modalState;\n  const chosen = modeRecords().filter(r=>selected.has(r.bib));\n  const opts = itemKeyOptions(chosen);\n  return `<div class=\"modal-overlay\" id=\"modalOverlay\"><div class=\"modal\">\n    <div class=\"modal-head\"><div><h3>Apply a tracking number</h3><p>${chosen.length} runner(s) selected — pick the item(s) this tracking number covers</p></div><button class=\"modal-close\" id=\"modalCloseX\">×</button></div>\n    <div class=\"modal-body\">\n      <div class=\"field-label\">Item(s) this covers <span class=\"footnote\">— only applied to a runner if that item doesn't already have a tracking number</span></div>\n      <div>\n        ${opts.map(o=>`<label style=\"display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;\">\n          <input type=\"checkbox\" data-bulk-ship-item=\"${esc(o.key)}\" ${s.itemKeys.includes(o.key)?\"checked\":\"\"}> ${esc(o.name)}\n        </label>`).join(\"\")}\n      </div>\n      <div class=\"field-label\" style=\"margin-top:10px;\">Tracking number <span class=\"footnote\">— required; shared across the whole selection</span></div>\n      <input type=\"text\" id=\"bulkShipTrackInput\" placeholder=\"Tracking #\" value=\"${esc(s.trackingNumber||\"\")}\">\n      <div class=\"field-label\" style=\"margin-top:10px;\">Note <span class=\"footnote\">— optional context for the audit log</span></div>\n      <textarea id=\"bulkShipNoteInput\" rows=\"2\" style=\"width:100%;\" placeholder=\"e.g. &quot;Bulk drop-off 8/31 — all Top 3&quot;\">${esc(s.note||\"\")}</textarea>\n    </div>\n    <div class=\"modal-foot\"><span></span><button class=\"btn primary small\" id=\"bulkShipConfirmBtn\" ${s.itemKeys.length?\"\":\"disabled\"}>Apply to ${chosen.length} runner(s)</button></div>\n  </div></div>`;\n}\n\nfunction bindBulkManualShipModal(){\n  const s = modalState;\n  document.querySelectorAll(\"[data-bulk-ship-item]\").forEach(cb => cb.onchange = () => {\n    const k = cb.dataset.bulkShipItem;\n    if(cb.checked){ if(!s.itemKeys.includes(k)) s.itemKeys.push(k); } else { s.itemKeys = s.itemKeys.filter(x=>x!==k); }\n    render();\n  });\n  const trackInput = document.getElementById(\"bulkShipTrackInput\");\n  if(trackInput) trackInput.oninput = () => { s.trackingNumber = trackInput.value; };\n  const noteInput = document.getElementById(\"bulkShipNoteInput\");\n  if(noteInput) noteInput.oninput = () => { s.note = noteInput.value; };\n  const confirmBtn = document.getElementById(\"bulkShipConfirmBtn\");\n  if(confirmBtn) confirmBtn.onclick = async () => {\n    const trackingNumber = (document.getElementById(\"bulkShipTrackInput\").value||\"\").trim();\n    if(!trackingNumber){ alert(\"Enter a tracking number first.\"); return; }\n    if(!isValidTrackingNumber(trackingNumber)){ alert(`Doesn't look like a real tracking number: ${trackingNumber}\\n\\nExpected a USPS (20-22 digit), UPS (\"1Z...\"), or FedEx (12 or 15 digit) tracking number.`); return; }\n    const note = (document.getElementById(\"bulkShipNoteInput\").value||\"\").trim();\n    const today = todayIso();\n    const chosen = modeRecords().filter(r=>selected.has(r.bib));\n    const affected = [];\n    for(const r of chosen){\n      for(const key of s.itemKeys){\n        const it = r.items.find(i=>(i.key||i.name)===key);\n        if(!it || it.trackingNumber) continue; // never overwrite a real tracking hit\n        it.trackingNumber = trackingNumber; it.shippedDate = today; it.delivered = false;\n        affected.push({ bib: r.bib, item: key });\n      }\n    }\n    await persistRecords();\n    await logAudit(\"bulk-tracking-applied\", { itemKeys: s.itemKeys, trackingNumber, note, count: affected.length, affected });\n    closeModal();\n    selected = new Set();\n    render();\n    alert(`Applied to ${affected.length} item(s) across the selection.`);\n  };\n}\n\n/* ---- Update Shipment Status: 3 steps — choose an action, define group(s) if building a population, review ---- */\nconst WORKFLOW_POPULATION_LABEL = { \"all\":\"All Finishers\", \"top3-overall\":\"Top 3 Overall\", \"top3-agegroup\":\"Top 3 Age Group\", \"person\":\"Specific person\" };\nfunction workflowPopulationRecords(population, searchName){\n  const mr = modeRecords();\n  if(population===\"top3-overall\") return mr.filter(r=>r.items.some(i=>(i.key||i.name)===\"gender-award\"));\n  if(population===\"top3-agegroup\") return mr.filter(r=>r.items.some(i=>(i.key||i.name)===\"division-award\"));\n  if(population===\"person\"){\n    const q = (searchName||\"\").trim().toLowerCase();\n    if(!q) return [];\n    return mr.filter(r=>r.bib===q || `${r.firstName} ${r.lastName}`.toLowerCase().includes(q));\n  }\n  return mr; // \"all\"\n}\n// Display-only summary of a group — always resolves item keys to their real\n// current name (never a hardcoded label, never a raw key like \"finisher-medal\").\n// Shows the FULL set of items a runner in this group actually ends up with,\n// not just this group's own checked boxes — a Top 3 Overall runner is also\n// an All Finishers runner, so their line shows Medal+T-Shirt+Award, not just\n// the Award, which is all this group alone would otherwise seem to say.\nfunction workflowGroupSummary(g, allGroups){\n  const recs = workflowPopulationRecords(g.population, g.searchName);\n  const opts = itemKeyOptions(recs.length?recs:modeRecords());\n  const recBibs = new Set(recs.map(r=>r.bib));\n  const unionKeys = new Set(g.itemKeys);\n  for(const other of (allGroups||[])){\n    if(other===g) continue;\n    const otherRecs = workflowPopulationRecords(other.population, other.searchName);\n    if(otherRecs.some(r=>recBibs.has(r.bib))) other.itemKeys.forEach(k=>unionKeys.add(k));\n  }\n  const itemNames = [...unionKeys].map(k=>(opts.find(o=>o.key===k)||{}).name || k);\n  const who = g.population===\"person\" ? `\"${g.searchName}\"` : WORKFLOW_POPULATION_LABEL[g.population];\n  return { recs, itemNames, who };\n}\n\nfunction renderShipmentWorkflowModal(){\n  const s = modalState;\n  const meta = currentEvent.meta||{};\n  return `<div class=\"modal-overlay\" id=\"modalOverlay\"><div class=\"modal\">\n    <div class=\"modal-head\"><div><h3>Update Shipment Status</h3><p>Step ${s.step} of 3</p></div><button class=\"modal-close\" id=\"modalCloseX\">×</button></div>\n    <div class=\"modal-body\">\n      ${s.step===1 ? `\n        <div class=\"footnote\" style=\"margin-bottom:14px;\">Stamps Contacts file: ${stampsContacts.length ? `${stampsContacts.length} loaded${meta.contactsImportedAt?\", imported \"+meta.contactsImportedAt.slice(0,10):\"\"}` : \"none loaded yet — load it from the sidebar first for the best match rate\"}.</div>\n        <button class=\"btn primary\" id=\"wfGoMatchBtn\" style=\"width:100%;text-align:left;padding:14px 16px;\" ${s.matching?\"disabled\":\"\"}>\n          <div style=\"font-weight:700;\">📬 ${s.matching?\"Matching… please wait\":\"Match Contacts with Tracking\"}</div>\n          <div class=\"footnote\" style=\"margin-top:4px;\">Import a Stamps export. Matches each label to your Contacts list, then continues straight into defining what this batch is shipping.</div>\n        </button>\n      ` : \"\"}\n      ${s.step===2 ? `\n        ${s.groups.length ? `\n        <div class=\"field-label\">Group(s) defined so far</div>\n        <div style=\"margin-bottom:12px;\">\n          ${s.groups.map((g,idx)=>{ const sum = workflowGroupSummary(g); return `<div class=\"footnote\" style=\"display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--line);\">\n            <span>${esc(sum.who)} → ${esc(sum.itemNames.join(\", \")||\"(no items)\")} <span class=\"footnote\">(${sum.recs.length} record(s))</span></span>\n            <button class=\"btn ghost small\" data-wf-remove-group=\"${idx}\" style=\"padding:1px 8px;\">Remove</button>\n          </div>`; }).join(\"\")}\n        </div>` : \"\"}\n        <div class=\"field-label\">Add a group — who does this apply to?</div>\n        <div style=\"display:flex;flex-direction:column;gap:4px;margin-bottom:10px;\">\n          <label><input type=\"radio\" name=\"wfpop\" data-wf-pop=\"all\" ${s.draftPopulation===\"all\"?\"checked\":\"\"}> All Finishers</label>\n          <label><input type=\"radio\" name=\"wfpop\" data-wf-pop=\"top3-overall\" ${s.draftPopulation===\"top3-overall\"?\"checked\":\"\"}> Top 3 Overall</label>\n          <label><input type=\"radio\" name=\"wfpop\" data-wf-pop=\"top3-agegroup\" ${s.draftPopulation===\"top3-agegroup\"?\"checked\":\"\"}> Top 3 Age Group</label>\n          <label><input type=\"radio\" name=\"wfpop\" data-wf-pop=\"person\" ${s.draftPopulation===\"person\"?\"checked\":\"\"}> Specific person</label>\n          ${s.draftPopulation===\"person\" ? `<input type=\"text\" id=\"wfSearchName\" placeholder=\"BIB or name\" value=\"${esc(s.draftSearchName)}\" style=\"margin-left:22px;max-width:220px;\">` : \"\"}\n        </div>\n        <div class=\"footnote\">${workflowPopulationRecords(s.draftPopulation, s.draftSearchName).length} record(s) match.</div>\n        <div class=\"field-label\" style=\"margin-top:10px;\">What item(s) go out for this group? <span class=\"footnote\">— never assumed, since it depends on what's available</span></div>\n        <div>${itemKeyOptions(modeRecords()).map(o=>`<label style=\"display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;\">\n          <input type=\"checkbox\" data-wf-item=\"${esc(o.key)}\" ${s.draftItemKeys.includes(o.key)?\"checked\":\"\"}> ${esc(o.name)}\n        </label>`).join(\"\")}</div>\n        <button class=\"btn ghost small\" id=\"wfAddGroupBtn\" style=\"margin-top:10px;\" ${s.draftItemKeys.length?\"\":\"disabled\"}>+ Add this group</button>\n      ` : \"\"}\n      ${s.step===3 ? `\n        ${s.bypassAll ? `\n        <div>Skipping group definition — applying to every matched runner's own item list, exactly as it already stands from import. Nothing new is being decided; this only updates status against what's already listed. It never overwrites an item that already has a tracking number, and a runner with 2+ shipments still gets the rest left for you to sort by hand on their own card.</div>\n        ` : `\n        <div>Applying this checks these items onto whichever real shipment(s) are already matched to each runner in these groups — the earliest one if a runner has more than one. It never overwrites an item that already has a tracking number, and a runner with 2+ shipments still gets the rest left for you to sort by hand on their own card.</div>\n        <div style=\"margin-top:8px;\">\n          ${s.groups.map(g=>{ const sum = workflowGroupSummary(g); return `<div class=\"footnote\" style=\"padding:3px 0;\">${esc(sum.who)} → ${esc(sum.itemNames.join(\", \"))} <span class=\"footnote\">(${sum.recs.length} record(s))</span></div>`; }).join(\"\")}\n        </div>\n        `}\n        ${s.applyResult ? `<div class=\"footnote\" style=\"margin-top:10px;color:var(--good);\">Applied to ${s.applyResult.appliedCount} runner(s).</div>` : \"\"}\n      ` : \"\"}\n    </div>\n    <div class=\"modal-foot\">\n      <span>${s.step>1 && !s.applyResult ?`<button class=\"btn ghost small\" id=\"wfBackBtn\">← Back</button>`:\"\"}</span>\n      <span style=\"display:flex;gap:8px;\">\n        ${s.step===2 ? `<button class=\"btn ghost small\" id=\"wfSkipBtn\">Skip — just update statuses</button><button class=\"btn primary small\" id=\"wfStep2NextBtn\" ${s.groups.length?\"\":\"disabled\"}>Next → (${s.groups.length} group(s))</button>` : \"\"}\n        ${s.step===3 && s.applyResult ? `<button class=\"btn primary small\" id=\"wfDoneBtn\">Done</button>` : \"\"}\n        ${s.step===3 && !s.applyResult ? `<button class=\"btn primary small\" id=\"wfApplyGroupsBtn\" ${s.applying?\"disabled\":\"\"}>${s.applying?\"Applying…\":\"Apply items to matched shipments\"}</button>` : \"\"}\n      </span>\n    </div>\n  </div></div>`;\n}\n\nfunction bindShipmentWorkflowModal(){\n  const s = modalState;\n  if(s.step===1){\n    const goMatch = document.getElementById(\"wfGoMatchBtn\");\n    if(goMatch) goMatch.onclick = async () => {\n      const coverage = await window.shipAPI.checkContactsCoverage();\n      const missing = coverage.filter(c=>!c.hasContacts);\n      if(missing.length){\n        const list = missing.map(c=>`• ${c.folderName} (${c.mode})`).join(\"\\n\");\n        const proceed = confirm(`These open event(s) don't have a Stamps Contacts file loaded yet:\\n\\n${list}\\n\\nWithout it, matching will be BIB-only — likely fewer matches than possible.\\n\\nImport anyway?`);\n        if(!proceed) return;\n      }\n      const filePath = await window.shipAPI.pickAnyFile(\"Select a Stamps history/label export CSV\");\n      if(!filePath) return;\n      s.matching = true; render();\n      const res = await window.shipAPI.importStampsHistoryFile(filePath);\n      await refreshEventData();\n      s.matching = false;\n      const sc = res.statusCheck || {};\n      alert(`${res.added} new label(s) added, ${res.duplicate} already recorded. ${res.autoAppliedCount} runner(s) newly linked to a tracking number just now (bib match only — no item/status change yet); ${res.remaining} still need review across all events.\\n\\nJust validated, across every event: ${sc.applied||0} tracking number(s) are actually on a real item, ${sc.pending||0} are matched to a runner but still waiting on the Apply step, ${sc.broken||0} have no runner link at all and need attention.\\n\\nNext, say what this batch is shipping.`);\n      s.step = 2;\n      render();\n    };\n  }\n  if(s.step===2){\n    document.querySelectorAll(\"[data-wf-pop]\").forEach(r => r.onchange = () => { s.draftPopulation = r.dataset.wfPop; s.draftItemKeys=[]; render(); });\n    const searchInput = document.getElementById(\"wfSearchName\");\n    if(searchInput) searchInput.oninput = () => { s.draftSearchName = searchInput.value; render(); };\n    document.querySelectorAll(\"[data-wf-item]\").forEach(cb => cb.onchange = () => {\n      const k = cb.dataset.wfItem;\n      if(cb.checked){ if(!s.draftItemKeys.includes(k)) s.draftItemKeys.push(k); } else { s.draftItemKeys = s.draftItemKeys.filter(x=>x!==k); }\n      render();\n    });\n    document.querySelectorAll(\"[data-wf-remove-group]\").forEach(b => b.onclick = () => {\n      s.groups.splice(Number(b.dataset.wfRemoveGroup), 1);\n      render();\n    });\n    const addGroupBtn = document.getElementById(\"wfAddGroupBtn\");\n    if(addGroupBtn) addGroupBtn.onclick = () => {\n      s.groups.push({ population: s.draftPopulation, itemKeys: [...s.draftItemKeys], searchName: s.draftSearchName });\n      s.draftItemKeys = []; s.draftPopulation = \"all\"; s.draftSearchName = \"\";\n      render();\n    };\n    const nextBtn = document.getElementById(\"wfStep2NextBtn\");\n    if(nextBtn) nextBtn.onclick = () => { s.step = 3; render(); };\n    const skipBtn = document.getElementById(\"wfSkipBtn\");\n    if(skipBtn) skipBtn.onclick = () => { s.bypassAll = true; s.step = 3; render(); };\n  }\n  if(s.step===3){\n    const backBtn = document.getElementById(\"wfBackBtn\");\n    if(backBtn) backBtn.onclick = () => { s.bypassAll = false; s.step = s.step-1; render(); };\n    const doneBtn = document.getElementById(\"wfDoneBtn\");\n    if(doneBtn) doneBtn.onclick = () => closeModal();\n    const applyBtn = document.getElementById(\"wfApplyGroupsBtn\");\n    if(applyBtn) applyBtn.onclick = async () => {\n      const bibItemKeys = {};\n      if(s.bypassAll){\n        // No group defined — apply to every matched runner's own item\n        // list exactly as it already stands from import. Skips group\n        // definition entirely; still never overwrites an item that\n        // already has a tracking number (enforced server-side).\n        for(const r of modeRecords()){\n          bibItemKeys[r.bib] = new Set(r.items.map(i => i.key || i.name));\n        }\n      } else {\n        // Union each group's items per bib — overlapping groups (a Top 3\n        // Overall runner is also an \"All Finishers\" runner) combine into one\n        // set per person instead of being applied twice.\n        for(const g of s.groups){\n          const recs = workflowPopulationRecords(g.population, g.searchName);\n          for(const r of recs){\n            if(!bibItemKeys[r.bib]) bibItemKeys[r.bib] = new Set();\n            for(const key of g.itemKeys) bibItemKeys[r.bib].add(key);\n          }\n        }\n      }\n      const payload = {};\n      for(const bib in bibItemKeys) payload[bib] = [...bibItemKeys[bib]];\n      s.applying = true; render();\n      const res = await window.shipAPI.applyGroupItems(currentEvent.folderPath, mode, payload);\n      await refreshEventData();\n      s.applying = false; s.applyResult = res;\n      render();\n    };\n    return;\n  }\n  const backBtn = document.getElementById(\"wfBackBtn\");\n  if(backBtn && s.step!==3) backBtn.onclick = () => { s.step = s.step-1; render(); };\n}\n\n/* ================= event binding ================= */\nfunction bindShellEvents(){\n  document.getElementById(\"homeBtn\").onclick = () => { screen = currentEvent ? \"dashboard\" : \"home\"; render(); };\n  document.getElementById(\"changeLibBtn\").onclick = pickLibrary;\n  document.getElementById(\"toggleSidebarBtn\").onclick = () => { sidebarCollapsed = !sidebarCollapsed; render(); };\n  const pickLibBtn = document.getElementById(\"pickLibBtn\"); if(pickLibBtn) pickLibBtn.onclick = pickLibrary;\n\n  const newFolderBtn = document.getElementById(\"newFolderBtn\");\n  if(newFolderBtn) newFolderBtn.onclick = createFolderPrompt;\n  const populateBtn = document.getElementById(\"populateBtn\");\n  if(populateBtn) populateBtn.onclick = async () => {\n    const res = await window.shipAPI.populateFromCalendar();\n    folders = await window.shipAPI.listEventFolders();\n    render();\n    alert(`Created ${res.created} new event folder(s). Existing folders were left untouched.`);\n  };\n\n  document.querySelectorAll(\"[data-open]\").forEach(b => b.onclick = () => {\n    const f = folders.find(x=>x.name===b.dataset.open);\n    openFolderEntry(f);\n  });\n\n  const backHomeBtn = document.getElementById(\"backHomeBtn\");\n  if(backHomeBtn) backHomeBtn.onclick = () => { screen = \"home\"; currentEvent=null; render(); };\n\n  const openFolderBtn = document.getElementById(\"openFolderBtn\");\n  if(openFolderBtn) openFolderBtn.onclick = () => window.shipAPI.openFolder(currentEvent.folderPath);\n\n  const linkCalendarBtn = document.getElementById(\"linkCalendarBtn\");\n  if(linkCalendarBtn) linkCalendarBtn.onclick = () => { modalState = { type:\"linkCalendar\" }; render(); };\n  const toggleShippingClosedBtn = document.getElementById(\"toggleShippingClosedBtn\");\n  if(toggleShippingClosedBtn) toggleShippingClosedBtn.onclick = async () => {\n    currentEvent.meta = { ...currentEvent.meta, shippingClosed: !currentEvent.meta.shippingClosed };\n    await window.shipAPI.saveFolderMeta(currentEvent.folderPath, currentEvent.meta);\n    await logAudit(\"shipping-status-changed\", { shippingClosed: currentEvent.meta.shippingClosed });\n    render();\n  };\n\n  document.querySelectorAll(\"[data-mode]\").forEach(b => b.onclick = () => { mode = b.dataset.mode; selected=new Set(); selectedId=null; filterRaces=new Set(); filterStatuses=new Set(); render(); });\n  // Deliberately NOT live-as-you-type — the operator asked to type the full\n  // BIB/name and trigger the search explicitly (Enter or the button), not\n  // have the table refilter on every keystroke.\n  const searchInput = document.getElementById(\"searchInput\");\n  if(searchInput){\n    searchInput.oninput = () => { searchDraft = searchInput.value; };\n    searchInput.onkeydown = (e) => { if(e.key===\"Enter\"){ searchQuery = searchInput.value.trim(); render(); } };\n  }\n  const searchGoBtn = document.getElementById(\"searchGoBtn\");\n  if(searchGoBtn) searchGoBtn.onclick = () => { searchQuery = (document.getElementById(\"searchInput\").value||\"\").trim(); render(); };\n  const searchClearBtn = document.getElementById(\"searchClearBtn\");\n  if(searchClearBtn) searchClearBtn.onclick = () => { searchQuery = \"\"; searchDraft = \"\"; render(); };\n\n  document.querySelectorAll(\"[data-filter]\").forEach(b => b.onclick = () => {\n    const k = b.dataset.filter;\n    if(k===\"all\"){ filterStatuses = new Set(); } else { if(filterStatuses.has(k)) filterStatuses.delete(k); else filterStatuses.add(k); }\n    render();\n  });\n  document.querySelectorAll(\"[data-race]\").forEach(b => b.onclick = () => {\n    const r = b.dataset.race;\n    if(filterRaces.has(r)) filterRaces.delete(r); else filterRaces.add(r);\n    render();\n  });\n  const raceClear = document.querySelector(\"[data-race-clear]\");\n  if(raceClear) raceClear.onclick = () => { filterRaces = new Set(); render(); };\n\n  const refreshSourceFilesBtn = document.getElementById(\"refreshSourceFilesBtn\");\n  if(refreshSourceFilesBtn) refreshSourceFilesBtn.onclick = async () => {\n    sourceFiles = await window.shipAPI.listSourceFiles(currentEvent.folderPath);\n    render();\n    alert(sourceFiles.length ? `Found ${sourceFiles.length} CSV file(s) in source-files/.` : \"No CSV files found in source-files/.\");\n  };\n  const refreshAllBtn = document.getElementById(\"refreshAllBtn\");\n  if(refreshAllBtn) refreshAllBtn.onclick = async () => {\n    await refreshEventData();\n    if(selectedId) detailUnassignedEntries = await window.shipAPI.unassignedEntriesForBib(currentEvent.folderPath, mode, selectedId);\n    render();\n  };\n  document.querySelectorAll(\"[data-import-file]\").forEach(b => b.onclick = () => doImport({ fileName: b.dataset.importFile }));\n  const browseElsewhereBtn = document.getElementById(\"browseElsewhereBtn\");\n  if(browseElsewhereBtn) browseElsewhereBtn.onclick = () => doImport({});\n  // These open themselves (main process launches the file in Excel once\n  // written) — no confirmation dialog needed, the file opening IS the confirmation.\n  const exportLogBtn = document.getElementById(\"exportLogBtn\");\n  if(exportLogBtn) exportLogBtn.onclick = () => window.shipAPI.exportLogCsv(currentEvent.folderPath);\n  const exportAuditBtn = document.getElementById(\"exportAuditBtn\");\n  if(exportAuditBtn) exportAuditBtn.onclick = () => window.shipAPI.exportAuditCsv(currentEvent.folderPath);\n  const exportShipmentReportBtn = document.getElementById(\"exportShipmentReportBtn\");\n  if(exportShipmentReportBtn) exportShipmentReportBtn.onclick = () => window.shipAPI.exportShipmentReportCsv(currentEvent.folderPath, mode);\n\n  const openValidate = document.getElementById(\"openValidate\");\n  if(openValidate) openValidate.onclick = () => { modalState = { type:\"validate\", idx:0 }; render(); };\n  const openTrack = document.getElementById(\"openTrack\");\n  if(openTrack) openTrack.onclick = () => { modalState = { type:\"shipmentWorkflow\", step:1, groups:[], draftPopulation:\"all\", draftItemKeys:[], draftSearchName:\"\", bypassAll:false }; render(); };\n  const loadContactsBtn = document.getElementById(\"loadContactsBtn\");\n  if(loadContactsBtn) loadContactsBtn.onclick = () => loadContactsFile();\n\n  document.querySelectorAll(\"[data-select]\").forEach(cb => cb.onchange = () => {\n    const bib = cb.dataset.select;\n    if(cb.checked) selected.add(bib); else selected.delete(bib);\n    render();\n  });\n  const selectAllCb = document.getElementById(\"selectAllCb\");\n  if(selectAllCb) selectAllCb.onchange = () => {\n    const visible = visibleRecords();\n    if(selectAllCb.checked) visible.forEach(r=>selected.add(r.bib));\n    else visible.forEach(r=>selected.delete(r.bib));\n    render();\n  };\n  document.querySelectorAll(\"[data-row]\").forEach(row => row.onclick = async (e) => {\n    if(e.target.tagName===\"INPUT\") return;\n    const bib = row.dataset.row;\n    selectedId = selectedId===bib ? null : bib;\n    addressEditUnlocked = false; addressWarningOpen = false;\n    detailUnassignedEntries = null;\n    render();\n    if(selectedId){\n      detailUnassignedEntries = await window.shipAPI.unassignedEntriesForBib(currentEvent.folderPath, mode, selectedId);\n      if(selectedId===bib) render();\n    }\n  });\n  const closeDetailBtn = document.getElementById(\"closeDetailBtn\");\n  if(closeDetailBtn) closeDetailBtn.onclick = () => { selectedId=null; addressEditUnlocked=false; addressWarningOpen=false; render(); };\n\n  const bulkNotifyBtn = document.getElementById(\"bulkNotifyBtn\");\n  if(bulkNotifyBtn) bulkNotifyBtn.onclick = () => {\n    const chosen = modeRecords().filter(r=>selected.has(r.bib));\n    const list = chosen.filter(r=>r.email);\n    const skipped = chosen.filter(r=>!r.email);\n    modalState = { type:\"notify\", list, skipped };\n    render();\n  };\n  const bulkClearBtn = document.getElementById(\"bulkClearBtn\");\n  if(bulkClearBtn) bulkClearBtn.onclick = () => { selected = new Set(); render(); };\n\n  const bulkMarkValidatedBtn = document.getElementById(\"bulkMarkValidatedBtn\");\n  if(bulkMarkValidatedBtn) bulkMarkValidatedBtn.onclick = async () => {\n    const chosen = modeRecords().filter(r=>selected.has(r.bib));\n    let skipped = 0;\n    const marked = [];\n    chosen.forEach(r=>{ if(r.addressStatus===\"READY\"){ r.stampsValidated = true; marked.push(r.bib); } else skipped++; });\n    await persistRecords();\n    await logAudit(\"bulk-stamps-validated\", { bibs: marked, count: marked.length });\n    render();\n    if(skipped) alert(`${skipped} of ${chosen.length} selected weren't marked — their address isn't READY yet.`);\n  };\n  const bulkManualShipBtn = document.getElementById(\"bulkManualShipBtn\");\n  if(bulkManualShipBtn) bulkManualShipBtn.onclick = () => {\n    modalState = { type:\"bulkManualShip\", itemKeys:[], trackingNumber:\"\", note:\"\" };\n    render();\n  };\n  const bulkValidateReadyBtn = document.getElementById(\"bulkValidateReadyBtn\");\n  if(bulkValidateReadyBtn) bulkValidateReadyBtn.onclick = async () => {\n    const targets = modeRecords().filter(r=>r.addressStatus===\"READY\" && !r.stampsValidated);\n    targets.forEach(r=>{ r.stampsValidated = true; });\n    await persistRecords();\n    await logAudit(\"bulk-stamps-validated\", { bibs: targets.map(r=>r.bib), count: targets.length });\n    render();\n    alert(`Marked ${targets.length} record(s) as STAMPS Validated.`);\n  };\n\n  // Shared by Save and Mark Validated — reads whatever's currently in the\n  // (editable, unlocked) address inputs into the record. Mark Validated\n  // must do this too: it used to skip straight to flipping the flag,\n  // silently discarding anything just typed but not yet saved, then\n  // re-rendering from the stale address and locking the fields — looking\n  // exactly like the edit had been wiped.\n  function readAddressFieldsIntoRecord(r){\n    const before = { ...r.address, email: r.email };\n    document.querySelectorAll(\"[data-addr]\").forEach(inp => {\n      const k = inp.dataset.addr;\n      if(k===\"email\") r.email = inp.value.trim(); else r.address[k] = inp.value.trim();\n    });\n    const a = r.address;\n    r.addressStatus = (a.street&&a.city&&a.state&&a.zip) ? \"READY\" : (a.street||a.city||a.state||a.zip) ? \"ADDRESS REVIEW REQUIRED\" : \"MISSING ADDRESS\";\n    return before;\n  }\n  const saveAddressBtn = document.getElementById(\"saveAddressBtn\");\n  if(saveAddressBtn) saveAddressBtn.onclick = async () => {\n    const r = records.find(x=>x.bib===selectedId && x.mode===mode);\n    const before = readAddressFieldsIntoRecord(r);\n    // Editing under the \"Edit anyway\" override invalidates the prior\n    // confirmation — the address just changed, so it needs re-validating.\n    if(addressEditUnlocked) r.stampsValidated = false;\n    addressEditUnlocked = false;\n    await persistRecords();\n    await logAudit(\"address-edit\", { bib: r.bib, before, after: { ...r.address, email: r.email }, newStatus: r.addressStatus });\n    render();\n  };\n  const markStampsValidatedBtn = document.getElementById(\"markStampsValidatedBtn\");\n  if(markStampsValidatedBtn) markStampsValidatedBtn.onclick = async () => {\n    const r = records.find(x=>x.bib===selectedId && x.mode===mode);\n    const locked = r.stampsValidated && !addressEditUnlocked;\n    let before = null;\n    if(!locked) before = readAddressFieldsIntoRecord(r); // fields are only editable/visible when unlocked\n    r.stampsValidated = !r.stampsValidated;\n    addressEditUnlocked = false; addressWarningOpen = false;\n    await persistRecords();\n    if(before) await logAudit(\"address-edit\", { bib: r.bib, before, after: { ...r.address, email: r.email }, newStatus: r.addressStatus });\n    await logAudit(\"stamps-validated\", { bib: r.bib, value: r.stampsValidated });\n    render();\n  };\n  const setPrimaryBtn = document.getElementById(\"setPrimaryBtn\");\n  if(setPrimaryBtn) setPrimaryBtn.onclick = () => setGroupPrimary(selectedId);\n  const unsetPrimaryBtn = document.getElementById(\"unsetPrimaryBtn\");\n  if(unsetPrimaryBtn) unsetPrimaryBtn.onclick = () => unsetGroupPrimary(selectedId);\n  const addressEditAnywayBtn = document.getElementById(\"addressEditAnywayBtn\");\n  if(addressEditAnywayBtn) addressEditAnywayBtn.onclick = () => { addressWarningOpen = true; render(); };\n  const addressWarnCancelBtn = document.getElementById(\"addressWarnCancelBtn\");\n  if(addressWarnCancelBtn) addressWarnCancelBtn.onclick = () => { addressWarningOpen = false; render(); };\n  const addressWarnConfirmBtn = document.getElementById(\"addressWarnConfirmBtn\");\n  if(addressWarnConfirmBtn) addressWarnConfirmBtn.onclick = () => { addressEditUnlocked = true; addressWarningOpen = false; render(); };\n  // No \"shipped\" checkbox — a tracking number IS the shipped signal, entered\n  // by the operator (or by the tracking-import match), never auto-stamped by\n  // the app just because a box got clicked.\n  const tshirtSizeInput = document.getElementById(\"tshirtSizeInput\");\n  if(tshirtSizeInput) tshirtSizeInput.onchange = async () => {\n    const r = records.find(x=>x.bib===selectedId && x.mode===mode);\n    const it = r.items.find(i=>i.name===\"T-Shirt\");\n    if(!it) return;\n    const oldSize = it.size;\n    it.size = tshirtSizeInput.value.trim();\n    if(it.size===oldSize) return;\n    await persistRecords();\n    await logAudit(\"tshirt-size-edit\", { bib: r.bib, oldSize, newSize: it.size });\n    render();\n  };\n  document.querySelectorAll(\"[data-track-url]\").forEach(a => a.onclick = (e) => {\n    e.preventDefault();\n    window.shipAPI.openExternal(a.dataset.trackUrl);\n  });\n  document.querySelectorAll(\"[data-ship-cell]\").forEach(td => td.onclick = async () => {\n    const track = td.dataset.shipTrack, date = td.dataset.shipDate, delivered = td.dataset.shipDelivered===\"1\", key = td.dataset.shipItem;\n    const r = records.find(x=>x.bib===selectedId && x.mode===mode);\n    const it = r.items.find(i=>(i.key||i.name)===key);\n    if(!it) return;\n    if(it.trackingNumber===track){\n      it.trackingNumber = \"\"; it.shippedDate = \"\"; it.delivered = false; it.deliveredDate = \"\"; it.labelAddress = null;\n      await window.shipAPI.unassignByTracking(track);\n      await persistRecords();\n      await logAudit(\"tracking-unassigned\", { bib: r.bib, item: it.name, trackingNumber: track });\n    } else {\n      if(it.trackingNumber && !confirm(`${it.name} is already in shipment ${it.trackingNumber}. Move it to ${track} instead?`)) return;\n      it.trackingNumber = track; it.shippedDate = date; it.delivered = delivered;\n      const res = await window.shipAPI.markAssignedByTracking(track, currentEvent.folderPath, mode, r.bib, [key]);\n      if(res.found){ it.delivered = res.delivered; it.deliveredDate = res.deliveredDate; it.labelAddress = res.labelAddress; }\n      await persistRecords();\n      await logAudit(\"tracking-applied\", { bib: r.bib, trackingNumber: track, shippedDate: date, items: [it.name] });\n    }\n    detailUnassignedEntries = await window.shipAPI.unassignedEntriesForBib(currentEvent.folderPath, mode, r.bib);\n    render();\n  });\n  const applyTrackAllBtn = document.getElementById(\"applyTrackAllBtn\");\n  if(applyTrackAllBtn) applyTrackAllBtn.onclick = async () => {\n    const track = (document.getElementById(\"allItemsTrack\").value||\"\").trim();\n    const date = (document.getElementById(\"allItemsDate\").value||\"\").trim();\n    if(!track){ alert(\"Enter a tracking number first.\"); return; }\n    const trackParts = track.split(\",\").map(s=>s.trim()).filter(Boolean);\n    const badParts = trackParts.filter(p=>!isValidTrackingNumber(p));\n    if(badParts.length){ alert(`Doesn't look like a real tracking number: ${badParts.join(\", \")}\\n\\nExpected a USPS (20-22 digit), UPS (\"1Z...\"), or FedEx (12 or 15 digit) tracking number.`); return; }\n    const r = records.find(x=>x.bib===selectedId && x.mode===mode);\n    // Applies to every item on the record — narrow it down afterward with\n    // the click-to-toggle Shipments table above, same as any Stamps row.\n    const affectedItems = r.items;\n    const affected = affectedItems.map(it=>it.name);\n    const affectedKeys = affectedItems.map(it=>it.key||it.name);\n    r.items.forEach(it=>{ it.trackingNumber = track; if(date) it.shippedDate = date; });\n    // If this tracking # (or any of several, comma-separated) matches a real\n    // Stamps history entry, mark it assigned there too — otherwise it'd keep\n    // showing as unassigned in the Stamps History screen even though it's\n    // already recorded here, and pull in its delivered date / label address.\n    for(const num of track.split(\",\").map(s=>s.trim()).filter(Boolean)){\n      const res = await window.shipAPI.markAssignedByTracking(num, currentEvent.folderPath, mode, r.bib, affectedKeys);\n      if(res.found){\n        affectedItems.forEach(it=>{ it.delivered = res.delivered; it.deliveredDate = res.deliveredDate; it.labelAddress = res.labelAddress; });\n      }\n    }\n    await persistRecords();\n    await logAudit(\"tracking-applied\", { bib: r.bib, trackingNumber: track, shippedDate: date, items: affected });\n    detailUnassignedEntries = await window.shipAPI.unassignedEntriesForBib(currentEvent.folderPath, mode, r.bib);\n    render();\n  };\n  const addItemBtn = document.getElementById(\"addItemBtn\");\n  if(addItemBtn) addItemBtn.onclick = async () => {\n    const input = document.getElementById(\"newItemName\");\n    const name = input.value.trim();\n    if(!name) return;\n    const trackInput = document.getElementBy olderPath, fileName, true)\n    : await window.shipAPI.importSourceFile(currentEvent.folderPath, filePath, true);\n  if(!result.ok){ alert(result.error); return; }\n  await refreshEventData();\n  const s = result.summary;\n  await logAudit(\"import\", { sourceFile: s.sourceFile, summary: s });\n  alert(`Import complete — ${s.sourceFile}\\n\\nSource rows: ${s.sourceRowCount}\\nEligible: ${s.eligible}\\nExcluded (no final result): ${s.excludedNoFinalResult}\\nExcluded (inconclusive identity): ${s.excludedInconclusive}\\nReady: ${s.ready}  Address required: ${s.addressRequired}  Review required: ${s.addressReview}\\nMissing email: ${s.missingEmail}  Unrecognized shirt: ${s.unrecognizedShirt}\\nDuplicate BIB: ${s.duplicateBib}  Duplicate email: ${s.duplicateEmail}\\nGender Top 3: ${s.genderTop3}  Division Top 3: ${s.divisionTop3}\\n\\nThis import REPLACES the ${mode} record set:\\nRemoved (no longer in this file, no shipment progress): ${s.removedStale}\\nKept but flagged (orphaned, but has tracking/shipped/validated data — check the exception log): ${s.orphanedProtected}`);\n  render();\n}\n\nfunction bindModalEvents(){\n  const overlay = document.getElementById(\"modalOverlay\");\n  if(overlay) overlay.onclick = (e) => { if(e.target===overlay) closeModal(); };\n  const x = document.getElementById(\"modalCloseX\"); if(x) x.onclick = closeModal;\n  const c1 = document.getElementById(\"modalCloseBtn\"); if(c1) c1.onclick = closeModal;\n  const c2 = document.getElementById(\"modalCloseBtn2\"); if(c2) c2.onclick = closeModal;\n\n  if(modalState.type===\"validate\") bindValidateModal();\n  if(modalState.type===\"assignHistoryDate\") bindAssignHistoryDateModal();\n  if(modalState.type===\"bulkManualShip\") bindBulkManualShipModal();\n  if(modalState.type===\"shipmentWorkflow\") bindShipmentWorkflowModal();\n  if(modalState.type===\"notify\") bindNotifyModal();\n  if(modalState.type===\"linkCalendar\") bindLinkCalendarModal();\n}\n\nfunction bindLinkCalendarModal(){\n  const saveBtn = document.getElementById(\"linkCalendarSaveBtn\");\n  if(saveBtn) saveBtn.onclick = async () => {\n    const val = document.getElementById(\"calendarSelect\").value;\n    await linkCalendarEvent(val || null);\n    closeModal();\n  };\n}\n\nfunction bindValidateModal(){\n  const pending = pendingAddressRecords();\n  const idx = Math.min(modalState.idx||0, Math.max(0,pending.length-1));\n  const r = pending[idx];\n  const skip = document.getElementById(\"vSkipBtn\");\n  if(skip) skip.onclick = () => { modalState.idx = idx+1; render(); };\n  const flag = document.getElementById(\"vFlagReviewBtn\");\n  if(flag) flag.onclick = async () => {\n    r.addressStatus = \"ADDRESS REVIEW REQUIRED\"; r.stampsValidated = false;\n    await persistRecords();\n    await logAudit(\"address-flagged-review\", { bib: r.bib });\n    render();\n  };\n  const save = document.getElementById(\"vSaveReadyBtn\");\n  if(save) save.onclick = async () => {\n    const before = { ...r.address };\n    document.querySelectorAll(\"[data-vaddr]\").forEach(inp => { r.address[inp.dataset.vaddr] = inp.value.trim(); });\n    const a = r.address;\n    r.addressStatus = (a.street&&a.city&&a.state&&a.zip) ? \"READY\" : \"ADDRESS REVIEW REQUIRED\";\n    r.stampsValidated = r.addressStatus === \"READY\";\n    await persistRecords();\n    await logAudit(\"address-edit\", { bib: r.bib, before, after: { ...r.address }, newStatus: r.addressStatus, viaValidateQueue: true });\n    render();\n  };\n}\n\nfunction bindNotifyModal(){\n  const s = modalState;\n  const btn = document.getElementById(\"notifyConfirmBtn\");\n  if(btn) btn.onclick = async () => {\n    let sent = 0;\n    const notifiedBibs = [];\n    for(const r of s.list){\n      const shippedItems = r.items.filter(i=>i.trackingNumber);\n      const trackLine = shippedItems.map(i=>`${i.name}: ${i.trackingNumber||\"(tracking pending)\"}`).join(\"\\n\");\n      const res = await window.shipAPI.sendViaOutlook({\n        to: r.email,\n        subject: `Citytri — your shipment is on the way (${currentEvent.active||currentEvent.rsu})`,\n        body: `Hi ${r.firstName},\\n\\nYour item(s) from ${currentEvent.active||currentEvent.rsu} (BIB ${r.bib}) have shipped:\\n\\n${trackLine}\\n\\nThanks for running with us!\\nCitytri`,\n        sendMode: \"Display\", // NEVER auto-send — every email opens as a draft; the human clicks Send in Outlook themselves. No exceptions.\n      });\n      if(res.ok){ sent++; notifiedBibs.push(r.bib); }\n    }\n    await logAudit(\"notify-drafts-opened\", { bibs: notifiedBibs, count: sent });\n    selected = new Set();\n    closeModal();\n    // \"Opened,\" not \"Sent\" — these are drafts; nothing goes out until the\n    // human clicks Send themselves in Outlook. See the incident in CHANGELOG 0.6.2.\n    alert(`Opened ${sent} of ${s.list.length} notification email draft(s) in Outlook — review and click Send there.`);\n  };\n}\n\nboot();\n<\/script>\n"); doc.close();
