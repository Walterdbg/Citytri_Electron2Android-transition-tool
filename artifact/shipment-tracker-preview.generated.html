  doc.open(); doc.write("<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Citytri Electron2Android — Mobile Preview</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap\">\n<style>\n  :root{\n    --bg:#F7F5F1; --surface:#FFFFFF; --surface-2:#FBF9F5;\n    --ink:#1E1B16; --ink-dim:#6B6459; --ink-faint:#9B9284;\n    --accent:#1F6F78; --accent-ink:#FFFFFF; --accent-2:#E8532A;\n    --line:#E4DFD5; --line-strong:#D2CABC;\n    --good:#2F7D4F; --good-bg:#E7F2EA;\n    --warn:#9A6B12; --warn-bg:#FBEFDB;\n    --bad:#B23A2E; --bad-bg:#FBE7E3;\n    --shadow: 0 1px 2px rgba(30,27,22,0.06), 0 8px 24px -12px rgba(30,27,22,0.18);\n  }\n  @media (prefers-color-scheme: dark){\n    :root:not([data-theme=\"light\"]){\n      --bg:#17140F; --surface:#201C16; --surface-2:#231F19;\n      --ink:#F3EEE4; --ink-dim:#B0A692; --ink-faint:#7C7362;\n      --accent:#5FC2CC; --accent-ink:#0B1E1F; --accent-2:#FF7A4D;\n      --line:#39332A; --line-strong:#4A4234;\n      --good:#6FCB93; --good-bg:#1C2E22;\n      --warn:#E7B75C; --warn-bg:#332811;\n      --bad:#FF8A78; --bad-bg:#3A1E19;\n      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);\n    }\n  }\n  :root[data-theme=\"dark\"]{\n    --bg:#17140F; --surface:#201C16; --surface-2:#231F19;\n    --ink:#F3EEE4; --ink-dim:#B0A692; --ink-faint:#7C7362;\n    --accent:#5FC2CC; --accent-ink:#0B1E1F; --accent-2:#FF7A4D;\n    --line:#39332A; --line-strong:#4A4234;\n    --good:#6FCB93; --good-bg:#1C2E22;\n    --warn:#E7B75C; --warn-bg:#332811;\n    --bad:#FF8A78; --bad-bg:#3A1E19;\n    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);\n  }\n  *{box-sizing:border-box;}\n  html,body{height:100%;}\n  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Karla', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }\n  h1,h2,h3,.display{ font-family:'Oswald', 'Arial Narrow', sans-serif; text-transform:uppercase; letter-spacing:0.02em; text-wrap:balance; margin:0; }\n  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }\n  /* Chromium's UA stylesheet gives <button> its own default text color\n     (doesn't inherit from body like other elements) — every custom button in\n     this app (event-row, chips, action-cards, wordmark) relies on inheriting\n     the theme's ink color, so reset it here once rather than per-class. */\n  button{ font-family:inherit; color:inherit; }\n  a{ color:var(--accent-2); }\n\n  /* height (not min-height) caps .app at the viewport, so .layout's children\n     (sidebar/main) scroll independently within it instead of the whole page\n     growing taller than the window and scrolling as one — which was\n     dragging the sidebar out of view along with the records table. */\n  .app{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }\n  /* #root (plain div, filled by render()) must itself be a flex container\n     with min-height:0 for .layout's flex:1 to have anything to flex within —\n     without this, the height:100vh above just clips content instead of\n     making it scrollable, since the constraint never reaches .layout. */\n  #root{ flex:1; min-height:0; display:flex; flex-direction:column; }\n  #root > .layout{ flex:1; min-height:0; }\n  #root > .home, #root > .setup-screen{ flex:1; min-height:0; overflow-y:auto; }\n  .topbar{ display:flex; align-items:center; gap:14px; padding:9px 24px; border-bottom:1px solid var(--line); background:var(--surface); }\n  .wordmark{ display:flex; align-items:baseline; gap:8px; background:none; border:none; cursor:pointer; padding:0; }\n  .wordmark .flag{ font-size:1.1rem; }\n  .wordmark h1{ font-size:1.15rem; font-weight:700; letter-spacing:0.03em; color:var(--ink); }\n  .sub{ font-size:0.72rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; }\n  .topbar-spacer{ flex:1; }\n  .btn{ appearance:none; border:none; border-radius:9px; padding:9px 16px; font-size:0.82rem; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; font-family:'Karla',sans-serif; }\n  .btn.primary{ background:var(--accent); color:var(--accent-ink); }\n  .btn.primary:hover{ filter:brightness(1.06); }\n  .btn.warn{ background:var(--accent-2); color:#fff; }\n  .btn.ghost{ background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong); }\n  .btn.ghost:hover{ border-color:var(--accent); color:var(--ink); }\n  .btn.small{ padding:5px 11px; font-size:0.72rem; border-radius:7px; }\n  .btn:disabled{ opacity:0.45; cursor:not-allowed; }\n\n  .layout{ flex:1; display:grid; grid-template-columns:360px 1fr; min-height:0; }\n  /* Reversible, not a real tradeoff — the sidebar (event name, status\n     stats, workflow buttons) is only ever hidden until toggled back; toggle\n     state lives in memory only, so it starts expanded again each launch. */\n  .layout.sidebar-collapsed{ grid-template-columns:1fr; }\n  .layout.sidebar-collapsed > .sidebar{ display:none; }\n  /* ============ Tablet + phone (<=960px): per\n     docs/Claude_Tablet_Mobile_UI_Protocol.md — TWO MUTUALLY-EXCLUSIVE\n     FULL-WIDTH STATES, not a side-by-side squeeze. Direct requirement:\n     \"The records list and expanded runner details must not be squeezed\n     beside this panel.\" This supersedes the earlier tablet side-column\n     attempt (220px sidebar + table) at this same breakpoint — that version\n     is gone. Desktop (>960px) is completely untouched by anything below:\n     .layout's base grid rule above still applies there exactly as before,\n     and none of these rules can match at desktop widths.\n\n     Reuses the exact same sidebarCollapsed state/toggle already built for\n     desktop — nothing new in JS. Default (not collapsed) shows the event\n     workspace (.sidebar) only, full width; toggling ☰ hides it and shows\n     the operational area (.main) instead, also full width. The general\n     \".layout.sidebar-collapsed > .sidebar{display:none}\" rule above already\n     covers \"hide the sidebar when toggled\" at every width, so it isn't\n     repeated here — only the narrow-width-specific pieces are added. */\n  @media (max-width:960px){\n    .layout{ display:block; overflow-y:auto; }\n    .layout .sidebar{ overflow-y:visible; width:100%; }\n    .layout .main{ overflow-y:visible; display:none; }\n    .layout.sidebar-collapsed .main{ display:block; }\n    .records-filter-head{ position:static; }\n    .topbar{ flex-wrap:wrap; row-gap:6px; }\n    .topbar .wordmark{ flex-basis:100%; }\n    /* Status and Workflow side by side when the width allows it (tablet),\n       per spec: \"Status and Workflow may use two balanced columns when the\n       width permits.\" Reverts to plain stacking below 600px — confirmed\n       too cramped for two real columns at phone width. */\n  }\n  @media (min-width:600px) and (max-width:960px){\n    .sidebar-status-workflow{ display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:start; }\n  }\n  /* Records: the desktop table is genuinely desktop-only now — showing it\n     at tablet width just because it happened to fit was resizing the\n     desktop solution, not designing for tablet (direct correction; the\n     protocol is explicit: tablet is \"not... a compressed desktop\"). Both\n     tablet and phone get the same purpose-built list view instead, built\n     around the protocol's own prioritized field set (BIB, name, placing,\n     items, address/shipment status — email demoted to the expanded detail\n     only). .records-card-view is always rendered by JS regardless of\n     width — only CSS decides which view shows, so there is no JavaScript\n     branching on viewport width. */\n  .records-card-view{ display:none; }\n  @media (max-width:960px){\n    .records-table-view{ display:none; }\n    .records-card-view{ display:block; }\n  }\n  .record-card{ background:var(--surface); border:1px solid var(--line); border-left:4px solid transparent; border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px; cursor:pointer; }\n  .record-card.open{ border-color:var(--accent); }\n  .record-card-head{ display:flex; align-items:center; gap:10px; }\n  .record-card-head input[type=\"checkbox\"]{ flex:none; }\n  .record-card-name{ font-weight:700; flex:1; }\n  .record-card-chevron{ color:var(--ink-faint); flex:none; }\n  .record-card-detail{ background:var(--surface-2); border-radius:10px; padding:16px 14px; margin:-4px 0 8px; }\n  /* min-width:0 matters here, not just min-height:0 — a CSS Grid track\n     sized with 1fr still has an implicit minimum equal to its content's\n     min-content width unless the item explicitly allows shrinking below\n     that. Without it, at a narrow single-column width the track gets\n     forced wide enough to fit whatever's least breakable inside (a table,\n     usually), instead of the real available width — confirmed directly:\n     774px wide inside a 390px viewport before this was added. */\n  .sidebar{ border-right:1px solid var(--line); background:var(--surface-2); padding:16px 14px 24px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; min-height:0; min-width:0; }\n  .main{ padding:22px 26px 40px; overflow-y:auto; display:flex; flex-direction:column; gap:20px; min-height:0; min-width:0; }\n\n  .home{ padding:32px 28px 40px; overflow-y:auto; display:flex; flex-direction:column; gap:22px; flex:1; }\n  .event-bucket-title{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-faint); font-weight:700; margin:18px 0 8px; }\n  .event-list{ background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }\n  .event-row{ display:flex; align-items:center; gap:14px; padding:9px 16px; background:transparent; ticky; top:-22px; z-index:6; background:var(--surface); box-shadow:0 4px 10px -6px rgba(0,0,0,0.35); }\n\n  .action-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }\n  @media (max-width:800px){ .action-grid{ grid-template-columns:1fr; } }\n  .action-card{ text-align:left; background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; cursor:pointer; display:flex; flex-direction:column; gap:8px; }\n  .action-card:hover{ border-color:var(--accent); }\n  .action-card .kicker{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint); font-weight:700; }\n  .action-card .title{ font-family:'Oswald',sans-serif; font-size:1.05rem; }\n  .action-card .desc{ font-size:0.8rem; color:var(--ink-dim); line-height:1.4; }\n\n  .stat-strip{ display:flex; gap:10px; flex-wrap:wrap; }\n  .stat-pill{ background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:0.76rem; color:var(--ink-dim); display:flex; gap:6px; align-items:center; }\n  .stat-pill b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }\n\n  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }\n  .chip{ border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-dim); font-size:0.74rem; padding:5px 10px; border-radius:999px; cursor:pointer; }\n  .chip:hover{ border-color:var(--accent); color:var(--ink); }\n  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }\n\n  table.rt{ width:100%; border-collapse:collapse; font-size:0.82rem; }\n  table.rt th{ text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line-strong); }\n  table.rt td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }\n  table.rt tr.selected{ background:color-mix(in srgb, var(--accent) 8%, transparent); }\n  table.rt tr:hover{ background:var(--surface-2); }\n  /* Solid fill + white text, not tinted-bg/tinted-text — the tinted pairing\n     read as low-contrast/near-black on some displays. */\n  .status-pill{ display:inline-block; padding:2px 9px; border-radius:6px; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:#fff; }\n  .status-pill.READY, .status-pill.SHIPPED{ background:var(--good); color:#0b1f13; }\n  .status-pill.ADDRESS-REQUIRED, .status-pill.MISSING-ADDRESS, .status-pill.NOT-STARTED{ background:var(--warn); color:#241a02; }\n  .status-pill.ADDRESS-REVIEW-REQUIRED, .status-pill.MATCH-REVIEW-REQUIRED{ background:var(--bad); color:#2a0c07; }\n  .item-badge{ display:inline-flex; align-items:center; gap:4px; font-size:0.7rem; padding:2px 7px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line-strong); margin:1px 3px 1px 0; }\n  .item-badge.shipped{ background:var(--good-bg); color:var(--good); border-color:transparent; text-decoration:line-through; }\n\n  .data-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:12px 16px; }\n  .field-label{ font-size:0.64rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint); margin-bottom:3px; }\n  .field-value{ font-size:0.9rem; font-weight:600; }\n  select, input[type=\"text\"]{ font-family:'Karla',sans-serif; font-size:0.84rem; padding:7px 10px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); width:100%; box-sizing:border-box; }\n  input[type=\"checkbox\"]{ width:16px; height:16px; }\n  label.f{ display:flex; flex-direction:column; gap:4px; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); font-weight:700; }\n\n  .item-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }\n  .item-row:last-child{ b ted\n// here since the renderer can't require() a Node module).\nfunction computeRecordStatus(r){\n  return r.items.some(i=>i.trackingNumber) ? \"SHIPPED\" : \"NOT STARTED\";\n}\nfunction pillClass(s){ return s.replace(/ /g,\"-\"); }\n// A status that means a REAL shipment ran into a real problem after it\n// actually went out — not \"Refunded\" (that's a voided label that never\n// shipped at all, excluded upstream in mergeStampsHistory, never even\n// reaches an item) but a package that shipped and then came back or needs\n// the shipper's attention.\nconst SHIPMENT_STATUS_NEEDS_REVIEW = [\"undeliverable\", \"action required\"];\nfunction needsShipmentReview(status){ return SHIPMENT_STATUS_NEEDS_REVIEW.includes(String(status||\"\").toLowerCase()); }\nfunction rankDisplay(v){ const n = Number(v); return Number.isFinite(n) && n>0 ? \"#\"+n : \"—\"; }\nfunction placingText(r){\n  if(r.mode!==\"post-event\") return `<span class=\"footnote\">${esc(r.division)||\"—\"}</span>`;\n  const g = Number(r.rankGender), d = Number(r.rankDivision);\n  const isGenderTop3 = g>=1 && g<=3, isDivTop3 = d>=1 && d<=3;\n  return `<div style=\"font-size:0.82rem;\">${esc(r.division)||\"—\"}</div>\n    <div class=\"footnote\">Gender ${isGenderTop3?`<b style=\"color:var(--good);\">${rankDisplay(g)}</b>`:rankDisplay(g)} · Div ${isDivTop3?`<b style=\"color:var(--good);\">${rankDisplay(d)}</b>`:rankDisplay(d)} · Overall ${rankDisplay(r.rankOverall)}</div>`;\n}\nfunction esc(s){ return String(s==null?\"\":s).replace(/&/g,\"&amp;\").replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\"); }\n\n// Recognized carrier tracking-number shapes — USPS (20-22 digit), UPS\n// (1Z + 16 alphanumeric), FedEx (12 or 15 digit). Anything else isn't a\n// real tracking number, hand-typed or not.\nfunction isValidTrackingNumber(s){\n  const n = String(s||\"\").replace(/\\s+/g,\"\");\n  return /^\\d{20,22}$/.test(n) || /^1Z[0-9A-Z]{16}$/.test(n) || /^\\d{12}$/.test(n) || /^\\d{15}$/.test(n);\n}\nfunction trackingCarrierUrl(s){\n  const n = String(s||\"\").replace(/\\s+/g,\"\");\n  if(!isValidTrackingNumber(n)) return null;\n  // Stamps.com is the actual system of record for every label this app\n  // deals with — its own tracking-details lookup resolves reliably for\n  // labels it generated. The carrier's own public tracking page (USPS's\n  // especially) can fail on the exact same number — confirmed directly,\n  // 2026-09-16 — so route through Stamps instead of guessing per carrier.\n  return `https://www.stamps.com/tracking-details/?t=${encodeURIComponent(n)}`;\n}\nfunction trackButton(num){\n  const url = trackingCarrierUrl(num);\n  // Text label, not an emoji/icon-only glyph — the packaged app doesn't\n  // reliably render color emoji, so an icon-only button can end up\n  // showing as an unrecognizable dot instead of a clickable control.\n  return url ? `<button class=\"btn ghost small\" data-track-url=\"${esc(url)}\" title=\"Open Stamps tracking details\">Track</button>` : \"\";\n}\n\n/* ================= state ================= */\nlet appVersion = \"\"; // fetched once at boot; shown in the top bar instead of the event name (already shown in the sidebar — redundant to repeat it)\nlet sidebarCollapsed = false; // in-memory only, like RaceResult's pin toggle — always starts expanded on a fresh launch\nlet settings = {};\nlet currentEvent = null;      // { name, folderPath, meta:{date?,calendarNum?,label?} }\nlet mode = \"pre-event\";       // active tab within the event workspace\nlet records = [];             // records for the CURRENT event (both modes, filtered client-side)\nlet logEntries = [];\nlet batches = [];\nlet sourceFiles = [];         // CSVs found in the current event's source-files/ folder\nlet stampsContacts = [];      // this event's Stamps Contacts file (what was actually uploaded to Stamps) — used as a name+address fallback when matching Stamps history\nlet selected = new Set();     // selected record bibs (within current mode's table)\nlet selectedId = null;        // bib of record shown in detail panel\nlet detailUnassignedEntries = null; // real Stamps history entries found for the currently-open record, not yet assigned to an item\nlet addressEditUnlocked = false; // \"Edit anyway\" override for the currently-open record's STAMPS-validated address; resets when selection changes\nlet addressWarningOpen = false;\nlet filterStatuses = new Set(); // empty = \"All\" — otherwise stacked, ANDed together\nlet filterRaces = new Set();  // distance/race filter (multi-select) — empty = all distances\nlet searchQuery = \"\";         // committed search filter (applied to the table)\nlet searchDraft = \"\";         // what's currently typed, not yet applied — search only runs on Enter/click\nlet modalState = null;\n\nlet screen = \"setup\";         // setup | home | dashboard | stampsHistory\nlet stampsHistoryDateGroups = []; // [{date,total,unassigned}], library-level, spans all events\nlet stampsHistory = [];       // full history entries, loaded once per Stamps History screen visit — used to preview a date's labels before assigning\nlet stampsHistoryLastImport = null; // {added,duplicate,skippedNoTracking,sourceRowCount} — just for the \"what happened\" banner\n\nconst rootEl = document.getElementById(\"root\");\nconst modalRootEl = document.getElementById(\"modalRoot\");\n\nasync function boot(){\n  appVersion = await window.shipAPI.getAppVersion();\n  settings = await window.shipAPI.loadSettings();\n  calendarEvents = await window.shipAPI.listCalendarEvents();\n  if(!settings.libraryRoot){ screen = \"setup\"; render(); return; }\n  folders = await window.shipAPI.listEventFolders();\n  // You work one event at a time — reopen straight into the last one instead\n  // of making you re-pick from the full calendar every launch.\n  const last = settings.lastOpenedFolder && folders.find(f=>f.name===settings.lastOpenedFolder);\n  if(last){ await openFolderEntry(last); return; }\n  screen = \"home\";\n  render();\n}\n\nasync function pickLibrary(){\n  const root = await window.shipAPI.pickLibraryRoot();\n  if(!root) return;\n  settings.libraryRoot = root;\n  folders = await window.shipAPI.listEventFolders();\n  screen = \"home\";\n  render();\n}\n\nasync function createFolderPrompt(){\n  const name = prompt(\"Name for the new event folder (e.g. \\\"34 - Some New Race\\\"):\");\n  if(!name || !name.trim()) return;\n  await window.shipAPI.createEventFolder(name.trim());\n  folders = await window.shipAPI.listEventFolders();\n  render();\n}\n\nasync function openFolderEntry(folder){\n  currentEvent = { ...folder, meta: await window.shipAPI.loadFolderMeta(folder.folderPath) };\n  mode = currentEvent.meta.date ? (hasOccurred(currentEvent.meta.date) ? \"post-event\" : \"pre-event\") : \"pre-event\";\n  await refreshEventData();\n  window.shipAPI.setLastFolder(folder.name);\n  screen = \"dashboard\";\n  selected = new Set(); selectedId = null;\n  render();\n}\n\nasync function linkCalendarEvent(num){\n  const ce = calendarEvents.find(e=>e.num===Number(num));\n  currentEvent.meta = ce ? { date: ce.date, calendarNum: ce.num, calendarName: ce.active||ce.rsu } : {};\n  await window.shipAPI.saveFolderMeta(currentEvent.folderPath, currentEvent.meta);\n  mode = currentEvent.meta.date ? (hasOccurred(currentEvent.meta.date) ? \"post-event\" : \"pre-event\") : mode;\n  render();\n}\n\nasync function refreshEventData(){\n  records = await window.shipAPI.loadRecords(currentEvent.folderPath);\n  logEntries = await window.shipAPI.loadLog(currentEvent.folderPath);\n  batches = await window.shipAPI.loadBatches(currentEvent.folderPath);\n  sourceFiles = await window.shipAPI.listSourceFiles(currentEvent.folderPath);\n  stampsContacts = await window.shipAPI.loadStampsContacts(currentEvent.folderPath);\n}\n\nfunction isStampsHistoryFile(filename){\n  return /^PrintHistory[_-]/i.test(filename.replace(/\\.[^.]+$/,\"\"));\n}\nfunction detectModeHint(filename){\n  const base = filename.replace(/\\.[^.]+$/,\"\");\n  if(/^Start list_BIB_Download/i.test(base)) return \"→ Pre-Event\";\n  if(/^ActiveResults_TShirt_address.*_Cleaned$/i.test(base)) return \"→ Post-Event\";\n  if(/^ActiveResults_TShirt_address/i.test(base)) return \"⚠ uncleaned — will be rejected\";\n  if(isStampsHistoryFile(filename)) return \"→ Stamps History (shared across every event, not just this one)\";\n  return \"unrecognized filename\";\n}\n\nasync function loadContactsFile(){\n  const filePath = await window.shipAPI.pickAnyFile(\"Select this event's Stamps Contacts CSV\");\n  if(!filePath) return false;\n  const preview = await window.shipAPI.importStampsContactsFile(currentEvent.folderPath, filePath, false);\n  const bibRate = preview.count ? preview.withBib/preview.count : 0;\n  if(bibRate < 0.5){\n    const proceed = confirm(`This doesn't look like a Stamps Contacts file: only ${preview.withBib} of ${preview.count} rows have a usable BIB. Did you pick the right file?\\n\\nLoad it anyway?`);\n    if(!proceed) return false;\n  }\n  const res = await window.shipAPI.importStampsContactsFile(currentEvent.folderPath, filePath, true);\n  stampsContacts = await window.shipAPI.loadStampsContacts(currentEvent.folderPath);\n  currentEvent.meta = { ...currentEvent.meta, contactsImportedAt: new Date().toISOString() };\n  await window.shipAPI.saveFolderMeta(currentEvent.folderPath, currentEvent.meta);\n  await logAudit(\"stamps-contacts-loaded\", { count: res.count, withBib: res.withBib });\n  render();\n  alert(`Loaded ${res.count} Stamps Contacts (${res.withBib} with a usable BIB).`);\n  return true;\n}\n\nasync function persistRecords(){ await window.shipAPI.saveRecords(currentEvent.folderPath, records); }\nasync function persistBatches(){ await window.shipAPI.saveBatches(currentEvent.folderPath, batches); }\n\n// Golden rule, direct instruction: \"DATA MODIFICATIONS LIVE IN THE LOGS.\n// LOGS ARE THE LAW.\" Every action that changes persisted data calls this.\nasync function logAudit(type, detail){\n  await window.shipAPI.appendAudit(currentEvent.folderPath, { at: new Date().toISOString(), type, mode, ...detail });\n}\n\nfunction modeRecords(){ return records.filter(r=>r.mode===mode); }\nfunction availableRaces(){ return [...new Set(modeRecords().map(r=>r.race).filter(Boolean))].sort(); }\n// Real freeze found on real data (411 records): emailGroupSize used to\n// re-filter the full record list on every single call, and groupColor\n// called it ONCE PER RECORD inside its own filter — an accidental O(n^2)\n// cost per call to groupColor, which itself is called ~3x per row. That's\n// ~200 million redundant operations for one render, enough to hang the app\n// solid. Fixed by building the email -> count map exactly ONCE per render\n// (invalidated in render(), see below) and having every group-related\n// helper do an O(1) lookup into it instead of re-scanning every time.\nlet _groupIndexCache = null;\nfunction getGroupIndex(){\n  if(_groupIndexCache) return _groupIndexCache;\n  const counts = new Map();\n  for(const r of records){\n    if(r.mode!==mode) continue;\n    const e = (r.email||\"\").toLowerCase();\n    if(!e) continue;\n    counts.set(e, (counts.get(e)||0)+1);\n  }\n  _groupIndexCache = counts;\n  return counts;\n}\n// How many OTHER records (same mode) share this email — the point is\n// spotting a family so their items can be shipped together, not flagging\n// a data error. A blank email never counts as a \"group.\"\nfunction emailGroupSize(email){\n  if(!email) return 1;\n  return getGroupIndex().get(email.toLowerCase()) || 1;\n}\n// 16 deliberately-spread hues, not a raw hash — a plain hash-mod-360 let two\n// unrelated families land on the same or near-same color purely by chance\n// once a real event had more than a handful of groups (confirmed on real\n// data: two different families both landed on the same blue). Assigning\n// from a fixed palette, in a stable sorted order across every group\n// currently in view, guarantees no two groups share a color until every\n// slot in the palette is used at least twice. Built once per render (see\n// _groupIndexCache above), not recomputed per row.\nconst GROUP_COLOR_PALETTE = [\"#E63946\",\"#457B9D\",\"#2A9D8F\",\"#E9C46A\",\"#F4A261\",\"#8E44AD\",\"#06A77D\",\"#D62828\",\"#3A86FF\",\"#FB5607\",\"#8338EC\",\"#43AA8B\",\"#FF006E\",\"#219EBC\",\"#FFB703\",\"#6A4C93\"];\nlet _groupColorMapCache = null;\nfunction getGroupColorMap(){\n  if(_groupColorMapCache) return _groupColorMapCache;\n  const groupedEmails = [...getGroupIndex().entries()].filter(([,c])=>c>1).map(([e])=>e).sort();\n  const map = new Map();\n  groupedEmails.forEach((e,i) => map.set(e, GROUP_COLOR_PALETTE[i % GROUP_COLOR_PALETTE.length]));\n  _groupColorMapCache = map;\n  return map;\n}\nfunction groupColor(email){\n  if(!email || emailGroupSize(email)<=1) return null;\n  return getGroupColorMap().get(email.toLowerCase()) || null;\n}\n// Ported from Waiver_Audit_7.py's primary_name_score/assign_primary_flags —\n// same scoring, same \"never guess when it's a tie\" rule. Adults only.\nfunction normalizedNamePart(v){ return String(v||\"\").toLowerCase().replace(/[^a-z0-9]/g,\"\"); }\nfunction primaryNameScore(person, email){\n  const localPart = normalizedNamePart((email||\"\").split(\"@\")[0]);\n  const first = normalizedNamePart(person.firstName), last = normalizedNamePart(person.lastName);\n  if(!localPart) return 0;\n  let score = 0;\n  if(first && last && (localPart.includes(first+last) || localPart.includes(last+first))) score += 20;\n  if(first.length>=4 && localPart.includes(first)) score += 8;\n  else if(first.length>=3 && localPart.includes(first.slice(0,3))) score += 2;\n  if(last.length>=4 && localPart.includes(last)) score += 8;\n  else if(last.length>=3 && localPart.includes(last.slice(0,3))) score += 3;\n  if(first && last && localPart.includes(first[0]+last)) score += 6;\n  return score;\n}\nfunction emailGroupRecords(email){\n  if(!email) return [];\n  const e = email.toLowerCase();\n  return modeRecords().filter(r=>(r.email||\"\").toLowerCase()===e);\n}\n// Unambiguous auto-detection only — a lone adult wins automatically, a\n// clear best-scoring adult wins, a tie or zero score picks nobody.\nfunction autoDetectedPrimaryBib(email){\n  const group = emailGroupRecords(email);\n  const adults = group.filter(r=>Number(r.age)>=18);\n  if(adults.length===1) return adults[0].bib;\n  if(adults.length<=1) return null;\n  const scored = adults.map(r=>({bib:r.bib, score:primaryNameScore(r, email)}));\n  const best = Math.max(...scored.map(s=>s.score));\n  const bestOnes = scored.filter(s=>s.score===best);\n  return (best>0 && bestOnes.length===1) ? bestOnes[0].bib : null;\n}\n// Manual override always wins over auto-detection.\nfunction effectivePrimaryBib(email){\n  const group = emailGroupRecords(email);\n  const manual = group.find(r=>r.isGroupPrimary===true);\n  return manual ? manual.bib : autoDetectedPrimaryBib(email);\n}\nasync function setGroupPrimary(bib){\n  const target = records.find(r=>r.bib===bib && r.mode===mode);\n  const email = (target?.email||\"\").toLowerCase();\n  if(!email) return;\n  for(const r of emailGroupRecords(email)) r.isGroupPrimary = (r.bib===bib);\n  await persistRecords();\n  await logAudit(\"group-primary-set\", { bib, email });\n  render();\n}\nasync function unsetGroupPrimary(bib){\n  const r = records.find(x=>x.bib===bib && x.mode===mode);\n  if(r) r.isGroupPrimary = false;\n  await persistRecords();\n  await logAudit(\"group-primary-unset\", { bib });\n  render();\n}\nfunction visibleRecords(){\n  let list = modeRecords();\n  if(filterRaces.size) list = list.filter(r=>filterRaces.has(r.race));\n  // Stacked status chips — every checked one must hold (AND), not just any one.\n  if(filterStatuses.has(\"ready\")) list = list.filter(r=>r.addressStatus===\"READY\");\n  if(filterStatuses.has(\"addressRequired\")) list = list.filter(r=>r.addressStatus===\"MISSING ADDRESS\");\n  if(filterStatuses.has(\"addressReview\")) list = list.filter(r=>r.addressStatus===\"ADDRESS REVIEW REQUIRED\");\n  if(filterStatuses.has(\"shipped\")) list = list.filter(r=>computeRecordStatus(r)===\"SHIPPED\");\n  if(filterStatuses.has(\"notStarted\")) list = list.filter(r=>computeRecordStatus(r)===\"NOT STARTED\");\n  if(filterStatuses.has(\"top3\")) list = list.filter(r=>r.items.some(i=>i.name.includes(\"Award\")));\n  if(filterStatuses.has(\"validated\")) list = list.filter(r=>r.stampsValidated);\n  if(filterStatuses.has(\"grouped\")) list = list.filter(r=>emailGroupSize(r.email)>1);\n  if(searchQuery.trim()){\n    const q = searchQuery.trim().toLowerCase();\n    list = list.filter(r => r.bib.toLowerCase().includes(q) || `${r.firstName} ${r.lastName}`.toLowerCase().includes(q) || (r.email||\"\").toLowerCase().includes(q));\n  }\n  // Grouped-by-email records are forced to the top, ahead of everything\n  // else — the point is deciding whether to ship a family's items as one\n  // combined package, so those rows need to be seen first, not buried\n  // alphabetically among hundreds of unrelated singles. Within a group, the\n  // Primary (if one's set) leads, then the rest of that family by last name.\n  list = [...list].sort((a,b) => {\n    const ga = emailGroupSize(a.email) > 1 ? 0 : 1, gb = emailGroupSize(b.email) > 1 ? 0 : 1;\n    if(ga !== gb) return ga - gb;\n    const ea = (a.email||\"\").toLowerCase(), eb = (b.email||\"\").toLowerCase();\n    if(!ea && !eb) return (a.lastName||\"\").localeCompare(b.lastName||\"\");\n    if(!ea) return 1;\n    if(!eb) return -1;\n    if(ea !== eb) return ea.localeCompare(eb);\n    const pa = effectivePrimaryBib(a.email)===a.bib ? 0 : 1, pb = effectivePrimaryBib(b.email)===b.bib ? 0 : 1;\n    if(pa !== pb) return pa - pb;\n    return (a.lastName||\"\").localeCompare(b.lastName||\"\");\n  });\n  return list;\n}\n\n/* ================= render dispatch ================= */\nfunction render(){\n  // Fresh group-index/color computation exactly once for this render pass\n  // — see getGroupIndex/getGroupColorMap above. Must be invalidated here,\n  // not left stale across renders, since records/mode can change.\n  _groupIndexCache = null;\n  _groupColorMapCache = null;\n  // Full innerHTML re-render (same idiom as Startline) loses focus/cursor\n  // position on every keystroke for any live-typing input (search box) unless\n  // explicitly restored — save it before redrawing, restore it after.\n  const active = document.activeElement;\n  const activeId = active && active.id;\n  const selStart = active && typeof active.selectionStart === \"number\" ? active.selectionStart : null;\n  const selEnd = active && typeof active.selectionEnd === \"number\" ? active.selectionEnd : null;\n  // Same problem as focus: replacing .main's innerHTML resets its scroll to\n  // the top on every render — so clicking a row far down a long table threw\n  // the operator back to row 1. Capture and restore it like focus above.\n  const mainEl = document.querySelector(\".main\");\n  const mainScrollTop = mainEl ? mainEl.scrollTop : 0;\n\n  document.getElementById(\"crumbSub\").textContent = appVersion ? `v${appVersion}` : \"Race merchandise shipment tracking\";\n  // The sidebar only exists on the event workspace screen — the toggle is\n  // meaningless (and hidden) anywhere else, same as the user's own framing:\n  // \"the sidebar is event specific.\"\n  document.getElementById(\"toggleSidebarBtn\").style.display = (screen===\"dashboard\" && currentEvent) ? \"\" : \"none\";\n  if(screen===\"setup\") rootEl.innerHTML = renderSetup();\n  else if(screen===\"home\") rootEl.innerHTML = renderHome();\n  else if(screen===\"stampsHistory\") rootEl.innerHTML = renderStampsHistoryScreen();\n  else rootEl.innerHTML = renderDashboard();\n  bindShellEvents();\n  modalRootEl.innerHTML = modalState ? renderModal() : \"\";\n  if(modalState) bindModalEvents();\n\n  const newMainEl = document.querySelector(\".main\");\n  if(newMainEl) newMainEl.scrollTop = mainScrollTop;\n\n  if(activeId){\n    const el = document.getElementById(activeId);\n    if(el){\n      el.focus();\n      if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch{} }\n    }\n  }\n}\n\n/* ================= setup ================= */\nfunction renderSetup(){\n  return `<div class=\"setup-screen\"><div class=\"setup-card\">\n    <h2 style=\"font-size:1.6rem;\">Choose a library folder</h2>\n    <p class=\"footnote\">This is where per-event shipment data will live — one subfolder per event, next to a <code>source-files</code> folder where you drop the Start List / ActiveResults CSVs. Pick an existing folder or create a new one.</p>\n    <button class=\"btn primary\" id=\"pickLibBtn\">📁 Choose folder</button>\n  </div></div>`;\n}\n\n/* ================= home / event picker ================= */\nfunction renderHome(){\n  return `<div class=\"home\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n      <h2 style=\"font-size:1.6rem;\">Event folders</h2>\n      <div style=\"display:flex;gap:8px;\">\n        <button class=\"btn ghost small\" id=\"populateBtn\">📅 Create folders for all calendar events</button>\n        <button class=\"btn primary small\" id=\"newFolderBtn\">＋ New event folder</button>\n      </div>\n    </div>\n    <div class=\"footnote\">${esc(settings.libraryRoot)} — source CSVs go in each event's <code>source-files/</code>, generated CSVs land in <code>exports/</code>, app run logs in <code>logs/</code>.</div>\n    <div class=\"event-list\">${folders.map(f => {\n      const m = /^(\\d+)\\s*-\\s*(.+?)(?:\\s*-\\s*(\\d{4}-\\d{2}-\\d{2}))?$/.exec(f.name);\n      const dataBadge = [\n        f.preEventCount>0 ? `<span class=\"status-pill READY\" style=\"margin-right:6px;\">Pre-Event: ${f.preEventCount}</span>` : `<span class=\"status-pill ADDRESS-REQUIRED\" style=\"margin-right:6px;\">Pre-Event: not imported</span>`,\n        f.postEventCount>0 ? `<span class=\"status-pill READY\" style=\"margin-right:6px;\">Post-Event: ${f.postEventCount}</span>` : `<span class=\"status-pill ADDRESS-REQUIRED\" style=\"margin-right:6px;\">Post-Event: not imported</span>`,\n        f.sourceFileCount>0 && f.recordCount===0 ? `<span class=\"footnote\">(${f.sourceFileCount} file(s) waiting in source-files/)</span>` : \"\",\n      ].join(\"\");\n      return `<button class=\"event-row\" data-open=\"${esc(f.name)}\">\n        <span class=\"num\">${m?esc(m[1]):\"\"}</span>\n        <span class=\"name\">${esc(m?m[2]:f.name)}</span>\n        ${dataBadge}\n        <span class=\"meta\">${m&&m[3]?m[3]:\"\"}</span>\n      </button>`;\n    }).join(\"\") || `<div class=\"footnote\" style=\"padding:16px;\">No event folders yet — create one to get started.</div>`}</div>\n  </div>`;\n}\n\n/* ================= dashboard (event workspace) ================= */\nfunction renderDashboard(){\n  const mr = modeRecords();\n  const validatedCount = mr.filter(r=>r.stampsValidated).length;\n  const reqCount = mr.filter(r=>r.addressStatus===\"MISSING ADDRESS\").length;\n  const reviewCount = mr.filter(r=>r.addressStatus===\"ADDRESS REVIEW REQUIRED\").length;\n  const shippedCount = mr.filter(r=>computeRecordStatus(r)===\"SHIPPED\").length;\n  const meta = currentEvent.meta || {};\n  const dateLine = meta.date\n    ? `${meta.date} (${hasOccurred(meta.date)?\"already occurred\":daysOut(meta.date)+\" days out\"})${meta.calendarName?` — linked to \"${esc(meta.calendarName)}\"`:\"\"}`\n    : `no date linked`;\n\n  return `\n  <div class=\"layout ${sidebarCollapsed?\"sidebar-collapsed\":\"\"}\">\n    <aside class=\"sidebar\">\n      <div>\n        <h3 style=\"font-size:1rem;line-height:1.3;\">${esc(currentEvent.name)}</h3>\n        <div class=\"footnote\" style=\"margin-top:4px;\">${dateLine}</div>\n      </div>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n        <button class=\"btn ghost small\" id=\"backHomeBtn\">← All events</button>\n        <button class=\"btn ghost small\" id=\"linkCalendarBtn\">📅 Calendar</button>\n        <button class=\"btn ghost small\" id=\"openFolderBtn\">📁 Folder</button>\n      </div>\n      <div class=\"footnote\" style=\"display:flex;justify-content:space-between;align-items:center;\">\n        <span>Shipping: <b style=\"color:var(--ink);\">${meta.shippingClosed?\"CLOSED\":\"OPEN\"}</b> — ${meta.shippingClosed?\"excluded from\":\"a candidate for\"} Stamps History auto-matching</span>\n        <button class=\"btn ghost small\" id=\"toggleShippingClosedBtn\">${meta.shippingClosed?\"Reopen\":\"Mark closed\"}</button>\n      </div>\n      <div class=\"chip-row\">\n        <button class=\"chip ${mode===\"pre-event\"?\"active\":\"\"}\" data-mode=\"pre-event\">Pre-Event</button>\n        <button class=\"chip ${mode===\"post-event\"?\"active\":\"\"}\" data-mode=\"post-event\">Post-Event</button>\n      </div>\n\n      <div class=\"sidebar-status-workflow\">\n      <div class=\"filter-group\">\n        <div class=\"filter-label\" style=\"display:flex;justify-content:space-between;align-items:center;\">\n          <span>Status — ${mode}</span>\n          <button class=\"btn ghost small\" id=\"refreshAllBtn\" title=\"Reload records/log/batches/source-files from disk\">🔄 Refresh</button>\n        </div>\n        <div class=\"card\" style=\"box-shadow:none;\">\n          <div class=\"card-body\" style=\"padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-size:0.82rem;\">\n            <div style=\"display:flex;justify-content:space-between;\"><span>Records</span><b class=\"mono\">${mr.length}</b></div>\n            <div style=\"display:flex;justify-content:space-between;\"><span>STAMPS Validated</span><b class=\"mono\">${validatedCount}</b></div>\n            <div style=\"display:flex;justify-content:space-between;\"><span>Missing address</span><b class=\"mono\">${reqCount}</b></div>\n            <div style=\"display:flex;justify-content:space-between;\"><span>Review required</span><b class=\"mono\">${reviewCount}</b></div>\n            <div style=\"display:flex;justify-content:space-between;\"><span>Shipped</span><b class=\"mono\">${shippedCount}</b></div>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"filter-group\" style=\"display:flex;flex-direction:column;gap:6px;\">\n        <div class=\"filter-label\">Workflow</div>\n        <button class=\"action-card\" id=\"openValidate\" style=\"padding:8px 12px;gap:2px;\"><span class=\"title\" style=\"font-size:0.88rem;\">1 · Validate Addresses</span></button>\n        <button class=\"action-card\" id=\"loadContactsBtn\" style=\"padding:8px 12px;gap:2px;\" title=\"${stampsContacts.length ? `${stampsContacts.length} loaded` : \"None loaded yet\"} — powers name+address matching when a label's BIB can't be read directly. Load before importing Stamps history for the best match rate.\"><span class=\"title\" style=\"font-size:0.88rem;\">2 · Load Stamps Contacts ${stampsContacts.length?`<span class=\"footnote\" style=\"font-weight:400;\">(${stampsContacts.length} loaded)</span>`:\"\"}</span></button>\n        <button class=\"action-card\" id=\"openTrack\" style=\"padding:8px 12px;gap:2px;\"><span class=\"title\" style=\"font-size:0.88rem;\">3 · Update Shipment Status</span></button>\n      </div>\n      </div>\n    </aside>\n\n    <div class=\"main\">\n      <div class=\"card\">\n        <div class=\"card-head\">\n          <h3>Files in <code>source-files/</code></h3>\n          <button class=\"btn ghost small\" id=\"refreshSourceFilesBtn\">🔄 Refresh file list</button>\n        </div>\n        <div class=\"card-body\" style=\"padding-top:10px;padding-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;\">\n          ${(()=>{ const relevant = sourceFiles.filter(f => mode===\"pre-event\" ? /^Start list_BIB_Download/i.test(f.name) : /^ActiveResults_TShirt_address/i.test(f.name));\n            return relevant.length ? relevant.map(f=>`\n              <span class=\"iname\" style=\"min-width:auto;\">${esc(f.name)}</span>\n              <span class=\"footnote\">${detectModeHint(f.name)}</span>\n              <button class=\"btn small primary\" data-import-file=\"${esc(f.name)}\">⬆ Import</button>`).join(\"\") : `<span class=\"footnote\" title='Drop the CSV into this event\\\\'s source-files folder (use \"📁 Folder\" in the sidebar), then hit Refresh.'>Expecting ${mode===\"pre-event\"?\"Start list_BIB_Download*.csv\":\"ActiveResults_TShirt_address*_Cleaned.csv\"} — nothing here yet.</span>`; })()}\n          <span style=\"width:1px;height:20px;background:var(--line);\"></span>\n          <button class=\"btn ghost small\" id=\"browseElsewhereBtn\">Browse elsewhere…</button>\n          <button class=\"btn ghost small\" id=\"exportLogBtn\" title=\"Export exception log CSV\">⬇ Exception log</button>\n          <button class=\"btn ghost small\" id=\"exportAuditBtn\" title=\"Export audit log CSV\">⬇ Audit log</button>\n          <button class=\"btn primary small\" id=\"exportShipmentReportBtn\" title=\"Export shipment report (print/warehouse)\">🖨 Shipment report</button>\n        </div>\n      </div>\n\n      ${renderRecordsTable()}\n    </div>\n  </div>`;\n}\n\nfunction renderRecordsTable(){\n  const list = visibleRecords();\n  const filters = [\n    [\"all\",\"All\"], [\"grouped\",\"Grouped (shares an email with another runner)\"], [\"top3\",\"Top 3 Only\"],\n    [\"ready\",\"Address Ready (has a complete address)\"], [\"validated\",\"STAMPS Validated (confirmed good to ship)\"],\n    [\"addressRequired\",\"Missing Address\"], [\"addressReview\",\"Review Required\"],\n    [\"shipped\",\"Shipped (has a tracking number on at least one item)\"],\n    [\"notStarted\",\"Not Started (nothing shipped yet)\"],\n  ];\n  const races = availableRaces();\n  const allVisibleSelected = list.length>0 && list.every(r=>selected.has(r.bib));\n  return `\n  <div class=\"card\">\n    <div class=\"card-head records-filter-head\" style=\"flex-direction:column;align-items:stretch;gap:6px;\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;\">\n        <h3 style=\"white-space:nowrap;\">Records — ${mode}</h3>\n        <input type=\"text\" id=\"searchInput\" placeholder=\"Search BIB or name…\" value=\"${esc(searchDraft)}\" style=\"max-width:200px;\">\n        <button class=\"btn ghost small\" id=\"searchGoBtn\">🔎 Search</button>\n        ${searchQuery ? `<button class=\"btn ghost small\" id=\"searchClearBtn\">✕ Clear (${esc(searchQuery)})</button>` : \"\"}\n        <div class=\"chip-row\">${filters.map(([k,l])=>`<button class=\"chip ${(k===\"all\"?filterStatuses.size===0:filterStatuses.has(k))?\"active\":\"\"}\" data-filter=\"${k}\" title=\"${esc(l)}\">${l.split(\" (\")[0]}</button>`).join(\"\")}</div>\n      </div>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;\">\n        ${races.length>1 ? `<div class=\"chip-row\"><span class=\"footnote\" style=\"align-self:center;margin-right:4px;\">Distance:</span>${races.map(r=>`<button class=\"chip ${filterRaces.has(r)?\"active\":\"\"}\" data-race=\"${esc(r)}\">${esc(r)}</button>`).join(\"\")}${filterRaces.size?`<button class=\"chip\" data-race-clear=\"1\">Clear</button>`:\"\"}</div>` : \"<div></div>\"}\n        <span class=\"footnote\">Showing <b>${list.length}</b> of ${modeRecords().length}${filterStatuses.size?` · ${filterStatuses.size} filter(s) stacked`:\"\"}</span>\n      </div>\n    </div>\n    <div class=\"card-body\">\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;\">\n        <button class=\"btn ghost small\" id=\"bulkValidateReadyBtn\">✓ Mark all Address-Ready as STAMPS Validated</button>\n        <span class=\"footnote\" title=\"Checkbox = select for a bulk action below. Click anywhere else on a row to open/edit that person's details. &quot;STAMPS Validated&quot; is your own confirmation that an address is good to ship — this app doesn't call Stamps.com automatically, so mark records validated (one at a time, or in bulk here) once you're satisfied.\">ℹ Checkbox = bulk-select · click a row to edit · \"Validated\" is your own confirmation, not a live Stamps.com check</span>\n      </div>\n      <div class=\"records-table-view\" style=\"overflow-x:auto;\">\n      <table class=\"rt\">\n        <thead><tr><th><input type=\"checkbox\" id=\"selectAllCb\" ${allVisibleSelected?\"checked\":\"\"} title=\"Select all visible rows\"></th><th>BIB</th><th>Name</th><th>Placing</th><th>Items</th><th title=\"From the Validate Addresses flow\">Address</th><th title=\"From the Update Shipment Status flow\">Shipment Status</th><th>Email</th></tr></thead>\n        <tbody>\n        ${list.map(r=>`\n          <tr class=\"${selectedId===r.bib?\"selected\":\"\"}\" data-row=\"${r.bib}\">\n            <td ${groupColor(r.email)?`style=\"background: linear-gradient(to right, ${groupColor(r.email)} 0 3px, color-mix(in srgb, ${groupColor(r.email)} 35%, transparent) 3px 6px, transparent 6px 100%);\"`:\"\"}><input type=\"checkbox\" data-select=\"${r.bib}\" ${selected.has(r.bib)?\"checked\":\"\"}></td>\n            <td class=\"mono\">${esc(r.bib)}</td>\n            <td>${esc(r.lastName)}, ${esc(r.firstName)} ${emailGroupSize(r.email)>1?(effectivePrimaryBib(r.email)===r.bib?`<span class=\"status-pill READY\" style=\"background:${groupColor(r.email)};color:#fff;\" title=\"Primary contact for this group of ${emailGroupSize(r.email)}\">Primary ×${emailGroupSize(r.email)}</span>`:`<span class=\"item-badge\" style=\"border-color:${groupColor(r.email)};color:${groupColor(r.email)};\" title=\"${emailGroupSize(r.email)} runners share this email — candidates to ship together\">Group ×${emailGroupSize(r.email)}</span>`):\"\"}</td>\n            <td>${placingText(r)}</td>\n            <td>${r.items.map(i=>`<span class=\"item-badge ${i.trackingNumber?\"shipped\":\"\"}\" ${needsShipmentReview(i.shipmentStatus)?`style=\"border-color:var(--bad);\"`:\"\"}>${esc(i.name)}${i.delivered?\" ✓\":\"\"}${needsShipmentReview(i.shipmentStatus)?` <span title=\"Stamps status: ${esc(i.shipmentStatus)} — needs review\">⚠️ ${esc(i.shipmentStatus)}</span>`:\"\"}</span>`).join(\"\")}</td>\n            <td><span class=\"status-pill ${pillClass(r.addressStatus)}\">${r.addressStatus}</span></td>\n            <td><span class=\"status-pill ${pillClass(computeRecordStatus(r))}\">${computeRecordStatus(r)}</span></td>\n            <td class=\"footnote\">${esc(r.email)||\"—\"} ${emailGroupSize(r.email)>1?`<span class=\"item-badge\" style=\"border-color:${groupColor(r.email)};color:${groupColor(r.email)};\" title=\"${emailGroupSize(r.email)} runners share this email\">×${emailGroupSize(r.email)}</span>`:\"\"}</td>\n          </tr>\n          ${selectedId===r.bib ? `<tr class=\"detail-row\"><td colspan=\"8\" style=\"background:var(--surface-2);padding:16px 18px;\">${renderDetailPanel(r)}</td></tr>` : \"\"}`).join(\"\") || (modeRecords().length ? `<tr><td colspan=\"8\" class=\"footnote\" style=\"padding:16px;\">No records match the current filters.</td></tr>` : `<tr><td colspan=\"8\" class=\"footnote\" style=\"padding:16px;\">No records yet — import a source CSV above.</td></tr>`)}\n        </tbody>\n      </table>\n      </div>\n      <!-- Mobile-only card view — same data, same data-row/data-select\n           attributes as the table above, so the existing click handlers\n           (document.querySelectorAll(\"[data-row]\")/(\"[data-select]\")) bind\n           to both with zero new JS. CSS alone decides which is visible;\n           both are always rendered. Per protocol: \"Do not display the\n           desktop records table on mobile\" / \"Do not treat horizontal\n           scrolling as an acceptable responsive solution\" — the table's\n           own columns don't fit a phone width without exactly that. -->\n      <div class=\"records-card-view\">\n        ${list.map(r=>`\n          <div class=\"record-card ${selectedId===r.bib?\"open\":\"\"}\" data-row=\"${r.bib}\" ${groupColor(r.email)?`style=\"border-left-color:${groupColor(r.email)};\"`:\"\"}>\n            <div class=\"record-card-head\">\n              <input type=\"checkbox\" data-select=\"${r.bib}\" ${selected.has(r.bib)?\"checked\":\"\"}>\n              <span class=\"mono\">${esc(r.bib)}</span>\n              <span class=\"record-card-name\">${esc(r.lastName)}, ${esc(r.firstName)}</span>\n              <span class=\"record-card-chevron\">${selectedId===r.bib?\"▲\":\"▼\"}</span>\n            </div>\n            ${emailGroupSize(r.email)>1?`<div>${effectivePrimaryBib(r.email)===r.bib?`<span class=\"status-pill READY\" style=\"background:${groupColor(r.email)};color:#fff;\">Primary ×${emailGroupSize(r.email)}</span>`:`<span class=\"item-badge\" style=\"border-color:${groupColor(r.email)};color:${groupColor(r.email)};\">Group ×${emailGroupSize(r.email)}</span>`}</div>`:\"\"}\n            <div>${placingText(r)}</div>\n            <div style=\"display:flex;gap:4px;flex-wrap:wrap;\">${r.items.map(i=>`<span class=\"item-badge ${i.trackingNumber?\"shipped\":\"\"}\" ${needsShipmentReview(i.shipmentStatus)?`style=\"border-color:var(--bad);\"`:\"\"}>${esc(i.name)}${i.delivered?\" ✓\":\"\"}${needsShipmentReview(i.shipmentStatus)?\" ⚠️\":\"\"}</span>`).join(\"\")}</div>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;\">\n              <span class=\"status-pill ${pillClass(r.addressStatus)}\">${r.addressStatus}</span>\n              <span class=\"status-pill ${pillClass(computeRecordStatus(r))}\">${computeRecordStatus(r)}</span>\n            </div>\n          </div>\n          ${selectedId===r.bib ? `<div class=\"record-card-detail\">${renderDetailPanel(r)}</div>` : \"\"}`).join(\"\") || (modeRecords().length ? `<div class=\"footnote\" style=\"padding:16px;\">No records match the current filters.</div>` : `<div class=\"footnote\" style=\"padding:16px;\">No records yet — import a source CSV above.</div>`)}\n      </div>\n      ${selected.size ? `<div class=\"bulkbar\" style=\"margin-top:12px;\">\n        <span class=\"footnote\">${selected.size} selected</span>\n        <button class=\"btn small primary\" id=\"bulkNotifyBtn\">✉ Notify selected (shipped items)</button>\n        <button class=\"btn small ghost\" id=\"bulkMarkValidatedBtn\">✓ Mark selected STAMPS Validated</button>\n        <button class=\"btn small ghost\" id=\"bulkManualShipBtn\">📦 Apply a tracking number to selected</button>\n        <button class=\"btn small ghost\" id=\"bulkClearBtn\">Clear</button>\n      </div>` : \"\"}\n    </div>\n  </div>`;\n}\n\nfunction renderDetailPanel(r){\n  const a = r.address;\n  return `\n  <div style=\"display:flex;flex-direction:column;gap:18px;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center;\">\n      <h3 style=\"font-size:1rem;\">${esc(r.firstName)} ${esc(r.lastName)} — BIB ${esc(r.bib)}</h3>\n      <button class=\"btn ghost small\" id=\"closeDetailBtn\">Close</button>\n    </div>\n      <div class=\"data-grid\">\n        <div><div class=\"field-label\">Gender</div><div class=\"field-value\">${esc(r.gender)||\"—\"}</div></div>\n        <div><div class=\"field-label\">Age</div><div class=\"field-value\">${esc(r.age)||\"—\"}</div></div>\n        <div><div class=\"field-label\">Division</div><div class=\"field-value\">${esc(r.division)||\"—\"}</div></div>\n        <div><div class=\"field-label\">Race</div><div class=\"field-value\">${esc(r.race)||\"—\"}</div></div>\n        <div><div class=\"field-label\">T-Shirt Size</div>${r.items.find(i=>i.name===\"T-Shirt\") ? `<input type=\"text\" id=\"tshirtSizeInput\" value=\"${esc(r.items.find(i=>i.name===\"T-Shirt\").size)}\" style=\"max-width:120px;\">` : `<div class=\"field-value\">—</div>`}</div>\n        ${r.mode===\"post-event\" ? `\n        <div><div class=\"field-label\">Final Result</div><div class=\"field-value\">${esc(r.finalResult)||\"—\"}</div></div>\n        <div><div class=\"field-label\">Rank Gender</div><div class=\"field-value\">${esc(r.rankGender)||\"—\"}</div></div>\n        <div><div class=\"field-label\">Rank Division</div><div class=\"field-value\">${esc(r.rankDivision)||\"—\"}</div></div>` : \"\"}\n      </div>\n\n      ${(() => {\n        const labelAddr = r.items.map(i=>i.labelAddress).find(a=>a && (a.street||a.city));\n        if(!labelAddr) return \"\";\n        return `<div class=\"warning-banner\" style=\"background:var(--good-bg);border-color:transparent;\">\n          <div><b>Confirmed by Stamps label</b> — this is the current address of record, ranked above whatever was originally submitted below:<br>\n          ${esc(labelAddr.street)}, ${esc(labelAddr.city)}, ${esc(labelAddr.state)} ${esc(labelAddr.zip)}</div>\n        </div>`;\n      })()}\n      <div>\n        <div class=\"field-label\" style=\"margin-bottom:8px;\">Address as originally submitted <span class=\"status-pill ${pillClass(r.addressStatus)}\">${r.addressStatus}</span> ${r.stampsValidated?`<span class=\"status-pill READY\">STAMPS VALIDATED</span>`:\"\"}</div>\n        ${r.addressReviewReason ? `<div class=\"footnote\" style=\"margin-bottom:6px;\">${esc(r.addressReviewReason)}</div>` : \"\"}\n        ${a.raw ? `<div class=\"footnote\" style=\"margin-bottom:8px;\">Raw source address (couldn't be auto-split — copy the right pieces into the fields below): <span style=\"color:var(--ink);\">\"${esc(a.raw)}\"</span></div>` : \"\"}\n        ${(() => {\n          const locked = r.stampsValidated && !addressEditUnlocked;\n          const dis = locked ? \"disabled\" : \"\";\n          return `\n        <div class=\"data-grid\">\n          <label class=\"f\">Street<input type=\"text\" data-addr=\"street\" value=\"${esc(a.street)}\" ${dis}></label>\n          <label class=\"f\">City<input type=\"text\" data-addr=\"city\" value=\"${esc(a.city)}\" ${dis}></label>\n          <label class=\"f\">State<input type=\"text\" data-addr=\"state\" value=\"${esc(a.state)}\" ${dis}></label>\n          <label class=\"f\">ZIP<input type=\"text\" data-addr=\"zip\" value=\"${esc(a.zip)}\" ${dis}></label>\n          <label class=\"f\">Country<input type=\"text\" data-addr=\"country\" value=\"${esc(a.country)}\" ${dis}></label>\n          <label class=\"f\">Email<input type=\"text\" data-addr=\"email\" value=\"${esc(r.email)}\"></label>\n        </div>\n        ${locked ? `<div class=\"stamps-lock\" style=\"margin-top:8px;\">🔒 STAMPS-validated — locked from accidental edits</div>` : \"\"}\n        ${addressWarningOpen ? `\n        <div class=\"warning-banner\" style=\"margin-top:10px;\">\n          <span>⚠ This address was confirmed as STAMPS Validated. Editing it will require re-validating before it's trusted for shipment again.</span>\n          <div class=\"warning-actions\">\n            <button class=\"btn ghost small\" id=\"addressWarnCancelBtn\" type=\"button\">Cancel</button>\n            <button class=\"btn primary small\" id=\"addressWarnConfirmBtn\" type=\"button\">Edit anyway</button>\n          </div>\n        </div>` : \"\"}\n        <div style=\"margin-top:10px;display:flex;gap:8px;\">\n          ${locked\n            ? `<button class=\"btn small ghost\" id=\"addressEditAnywayBtn\">Edit anyway</button>`\n            : `<button class=\"btn small primary\" id=\"saveAddressBtn\">Save address</button>`}\n          <button class=\"btn small ghost\" id=\"markStampsValidatedBtn\">${r.stampsValidated?\"Unmark\":\"Mark\"} STAMPS validated</button>\n        </div>\n        ${emailGroupSize(r.email)>1 ? `\n        <div class=\"footnote\" style=\"margin-top:10px;\">Shares an email with ${emailGroupSize(r.email)-1} other runner(s)${effectivePrimaryBib(r.email)===r.bib?\" — this is the group's primary contact\":r.isGroupPrimary===false?\"\":autoDetectedPrimaryBib(r.email)?\"\":\" — no primary set, pick one when ready\"}.</div>\n        <div style=\"margin-top:6px;\">\n          ${effectivePrimaryBib(r.email)===r.bib\n            ? `<button class=\"btn small ghost\" id=\"unsetPrimaryBtn\">Unmark as primary</button>`\n            : `<button class=\"btn small ghost\" id=\"setPrimaryBtn\">Mark as primary contact</button>`}\n        </div>` : \"\"}\n        `;\n        })()}\n      </div>\n\n      <div>\n        <div class=\"field-label\" style=\"margin-bottom:6px;\">Shipments <span class=\"footnote\">— same orientation as the printed warehouse report: BIB first, then one column per item, one row per actual shipment from Stamps. Tracking #, date, and delivered status come from Stamps and aren't editable here — click a cell to say which item(s) that shipment covers.</span></div>\n        ${(()=>{\n          const byTrack = new Map();\n          for(const it of r.items){ if(!it.trackingNumber) continue; if(!byTrack.has(it.trackingNumber)) byTrack.set(it.trackingNumber, { shippedDate:it.shippedDate, delivered:it.delivered }); }\n          const rows = [...byTrack.entries()].map(([track,g])=>({ track, date:g.shippedDate, delivered:g.delivered }));\n          for(const e of (detailUnassignedEntries||[])){\n            if(byTrack.has(e.trackingNumber)) continue;\n            rows.push({ track:e.trackingNumber, date:e.shipDate, delivered:!!e.delivered });\n          }\n          if(!rows.length) return `<div class=\"footnote\" style=\"margin-bottom:10px;\">No shipments recorded yet for this runner.</div>`;\n          return `<div style=\"overflow-x:auto;margin-bottom:10px;\"><table class=\"rt\">\n            <thead><tr><th>BIB</th><th>Tracking ID</th><th>Date</th><th>Delivered</th>${r.items.map(it=>`<th>${esc(it.name)}${it.size?` (${esc(it.size)})`:\"\"}</th>`).join(\"\")}<th></th></tr></thead>\n            <tbody>${rows.map(row=>`<tr>\n              <td class=\"mono\">${esc(r.bib)}</td>\n              <td class=\"mono\">${esc(row.track)}</td>\n              <td class=\"footnote\">${esc(row.date)||\"—\"}</td>\n              <td>${row.delivered?\"✓\":\"\"}</td>\n              ${r.items.map(it=>{\n                const key = it.key||it.name;\n                const on = it.trackingNumber===row.track;\n                return `<td data-ship-cell data-ship-track=\"${esc(row.track)}\" data-ship-date=\"${esc(row.date)}\" data-ship-delivered=\"${row.delivered?1:0}\" data-ship-item=\"${esc(key)}\" style=\"text-align:center;cursor:pointer;\" title=\"Click to ${on?\"take out of\":\"put in\"} this shipment\">${on?\"✓\":\"—\"}</td>`;\n              }).join(\"\")}\n              <td>${trackButton(row.track)}</td>\n            </tr>`).join(\"\")}</tbody>\n          </table></div>`;\n        })()}\n        <div class=\"field-label\" style=\"margin-bottom:6px;\">Record a shipment by hand <span class=\"footnote\">— only when you already know a tracking number Stamps hasn't given you yet</span></div>\n        <div class=\"apply-all-box\">\n          <b style=\"font-size:0.78rem;\">📦 Applies to every item — adjust which ones in the table above after</b>\n          <input type=\"text\" id=\"allItemsTrack\" placeholder=\"Tracking #\" style=\"width:26ch;\">\n          <input type=\"text\" id=\"allItemsDate\" placeholder=\"Shipping date\" style=\"max-width:130px;\">\n          <button class=\"btn small primary\" id=\"applyTrackAllBtn\">Apply ↓</button>\n        </div>\n        <div style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;\">\n          <input type=\"text\" id=\"newItemName\" placeholder=\"Add item (e.g. replacement medal)\" style=\"max-width:260px;\">\n          <input type=\"text\" id=\"newItemTrack\" placeholder=\"Tracking # (optional)\" style=\"max-width:200px;\">\n          <input type=\"text\" id=\"newItemDate\" placeholder=\"Shipping date (optional)\" style=\"max-width:140px;\">\n          <button class=\"btn small ghost\" id=\"addItemBtn\">Add item</button>\n        </div>\n      </div>\n    </div>\n  </div>`;\n}\n\n/* ================= modal dispatch ================= */\nfunction renderModal(){\n  if(modalState.type===\"validate\") return renderValidateModal();\n  if(modalState.type===\"assignHistoryDate\") return renderAssignHistoryDateModal();\n  if(modalState.type===\"bulkManualShip\") return renderBulkManualShipModal();\n  if(modalState.type===\"shipmentWorkflow\") return renderShipmentWorkflowModal();\n  if(modalState.type===\"notify\") return renderNotifyModal();\n  if(modalState.type===\"linkCalendar\") return renderLinkCalendarModal();\n  return \"\";\n}\n\nfunction renderLinkCalendarModal(){\n  const sorted = [...calendarEvents].sort((a,b)=> new Date(a.date)-new Date(b.date));\n  return `<div class=\"modal-overlay\" id=\"modalOverlay\"><div class=\"modal\">\n    <div class=\"modal-head\"><div><h3>Link to calendar</h3><p>Optional — only used to show the event date and default which tab opens.</p></div><button class=\"modal-close\" id=\"modalCloseX\">×</button></div>\n    <div class=\"modal-body\">\n      <select id=\"calendarSelect\">\n        <option value=\"\">— none —</option>\n        ${sorted.map(e=>`<option value=\"${e.num}\" ${currentEvent.meta && currentEvent.meta.calendarNum===e.num?\"selected\":\"\"}>#${e.num} · ${e.date} · ${esc(e.active||e.rsu)}</option>`).join(\"\")}\n      </select>\n    </div>\n    <div class=\"modal-foot\"><span></span><button class=\"btn primary small\" id=\"linkCalendarSaveBtn\">Save</button></div>\n  </div></div>`;\n}\nfunction closeModal(){ modalState = null; render(); }\n\n/* ---- Validate Addresses queue ---- */\nfunction pendingAddressRecords(){\n  return modeRecords().filter(r=>r.addressStatus!==\"READY\" || !r.stampsValidated);\n}\nfunction renderValidateModal(){\n  const pending = pendingAddressRecords();\n  const idx = Math.min(modalState.idx||0, Math.max(0,pending.length-1));\n  const r = pending[idx];\n  return `<div class=\"modal-overlay\" id=\"modalOverlay\"><div class=\"modal\">\n    <div class=\"modal-head\"><div><h3>Validate Addresses</h3><p>${pending.length} pending in ${mode} · ${idx+1} of ${pending.length||0}</p></div><button class=\"modal-close\" id=\"modalCloseX\">×</button></div>\n    <div class=\"modal-body\">\n      ${!r ? `<div class=\"warning-banner\" style=\"background:var(--good-bg);color:var(--good);\">All addresses validated for ${mode}. 🎉</div>` : `\n      <div><b>${esc(r.firstName)} ${esc(r.lastName)}</b> — BIB ${esc(r.bib)} <span class=\"status-pill ${pillClass(r.addressStatus)}\">${r.addressStatus}</span></div>\n      ${r.addressReviewReason ? `<div class=\"footnote\">${esc(r.addressReviewReason)}</div>`:\"\"}\n      ${r.address.raw ? `<div class=\"footnote\">Raw source address: \"${esc(r.address.raw)}\"</div>` : \"\"}\n      <div class=\"data-grid\">\n        <label class=\"f\">Street<input type=\"text\" data-vaddr=\"street\" value=\"${esc(r.address.street)}\"></label>\n        <label class=\"f\">City<input type=\"text\" data-vaddr=\"city\" value=\"${esc(r.address.city)}\"></label>\n        <label class=\"f\">State<input type=\"text\" data-vaddr=\"state\" value=\"${esc(r.address.state)}\"></label>\n        <label class=\"f\">ZIP<input type=\"text\" data-vaddr=\"zip\" value=\"${esc(r.address.zip)}\"></label>\n        <label class=\"f\">Country<input type=\"text\" data-vaddr=\"country\" value=\"${esc(r.address.country)}\"></label>\n      </div>`}\n    </div>\n    <div class=\"modal-foot\">\n      <span></span>\n      <div style=\"display:flex;gap:8px;\">\n        ${r ? `<button class=\"btn ghost small\" id=\"vSkipBtn\">Skip</button>\n        <button class=\"btn ghost small\" id=\"vFlagReviewBtn\">Flag: Review Required</button>\n        <button class=\"btn primary small\" id=\"vSaveReadyBtn\">Save &amp; Mark STAMPS Validated</button>` : `<button class=\"btn primary small\" id=\"modalCloseBtn\">Done</button>`}\n      </div>\n    </div>\n  </div></div>`;\n}\n\n/* ================= Stamps History (library-level, all events) ================= */\n\nasync function openStampsHistoryScreen(){\n  screen = \"stampsHistory\";\n  stampsHistory = await window.shipAPI.loadStampsHistory();\n  stampsHistoryDateGroups = await window.shipAPI.stampsHistoryDateGroups();\n  folders = await window.shipAPI.listEventFolders(); // for the assign-date event picker\n  render();\n}\n\nlet selectedHistoryDates = new Set(); // ship dates checked in the Stamps History table, for bulk assign\n\nasync function openAssignModalForDates(dates){\n  const entries = stampsHistory.filter(h => dates.includes(h.shipDate) && !h.assignment);\n  modalState = { type:\"assignHistoryDate\", dates, step:1, folderName:\"\", targetMode:\"post-event\", itemKeys:[], eventRecords:[], result:null, entries, suggestions:[], openEventCount:0 };\n  render();\n  // Fetch after the first paint so the label preview shows immediately —\n  // exactly what was asked for: recognize the batch before being asked to\n  // pick anything, not guess blind from a dropdown.\n  const { suggestions, openEventCount } = await window.shipAPI.suggestEventForDates(dates);\n  if(modalState !== null && modalState.dates === dates){\n    modalState.suggestions = suggestions;\n    modalState.openEventCount = openEventCount;\n    const top = suggestions[0];\n    // Auto-fill the event+mode only when the evidence is genuinely\n    // one-sided (one open event, or one dominant match) — the operator\n    // still has to say what item(s) this batch was, and can always\n    // override the event/mode pick below.\n    if(top && top.confident){\n      modalState.folderName = top.folderName;\n      modalState.targetMode = top.mode;\n      const f = folders.find(x=>x.name===top.folderName);\n      modalState.eventRecords = f ? (await window.shipAPI.loadRecords(f.folderPath)).filter(r=>r.mode===top.mode) : [];\n    }\n    render();\n  }\n}\n\nfunction renderStampsHistoryScreen(){\n  const groups = stampsHistoryDateGroups;\n  const unassignedGroups = groups.filter(g=>g.unassigned>0);\n  const selectedCount = [...selectedHistoryDates].filter(d=>unassignedGroups.some(g=>g.date===d)).length;\n  const selectedLabelCount = unassignedGroups.filter(g=>selectedHistoryDates.has(g.date)).reduce((n,g)=>n+g.unassigned,0);\n  const allSelected = unassignedGroups.length>0 && unassignedGroups.every(g=>selectedHistoryDates.has(g.date));\n  return `<div class=\"home\">\n    <div>\n      <button class=\"btn ghost small\" id=\"stampsHistoryBackBtn\">${currentEvent ? `← Back to ${esc(currentEvent.name)}` : \"← All events\"}</button>\n    </div>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n      <h2 style=\"font-size:1.6rem;\">Stamps History</h2>\n      <div style=\"display:flex;gap:8px;\">\n        <button class=\"btn ghost small\" id=\"rerunAutoMatchBtn\">🔁 Re-run auto-match</button>\n        <button class=\"btn primary small\" id=\"importHistoryBtn\">📄 Import Stamps history export</button>\n      </div>\n    </div>\n    <div class=\"footnote\">Shared across every event — a print run can cover more than one event on the same day. Importing only ADDS new labels (matched by tracking number); nothing already recorded here is ever removed, so re-importing an overlapping export is safe. Every import auto-matches against every OPEN event's roster right away — tracking numbers land automatically, no per-date confirmation needed for the normal case. Only what doesn't match anything open stays listed below for manual review.</div>\n    ${stampsHistoryLastImport ? `<div class=\"warning-banner\" style=\"background:#eef3ff;border-color:#a9c2f0;\"><div>Last import: <b>${stampsHistoryLastImport.added}</b> new, ${stampsHistoryLastImport.duplicate} already recorded, ${stampsHistoryLastImport.skippedNoTracking} skipped (no tracking number), ${stampsHistoryLastImport.skippedNeverShipped||0} skipped (label printed or refunded — never actually shipped). <b>${stampsHistoryLastImport.autoAppliedCount||0}</b> newly bib-linked just now; ${stampsHistoryLastImport.remaining??\"\"} still need manual review. Validated just now: ${stampsHistoryLastImport.statusCheck?.applied??0} on a real item, ${stampsHistoryLastImport.statusCheck?.pending??0} matched but waiting on Apply, ${stampsHistoryLastImport.statusCheck?.broken??0} with no runner link.</div></div>` : \"\"}\n    ${unassignedGroups.length ? `<div style=\"display:flex;align-items:center;gap:10px;\">\n      <button class=\"btn ghost small\" id=\"selectAllHistoryDatesBtn\">${allSelected?\"☑\":\"☐\"} Select all unassigned dates (${unassignedGroups.length})</button>\n      ${selectedCount ? `<button class=\"btn primary small\" id=\"bulkAssignBtn\">Assign ${selectedCount} date(s) — ${selectedLabelCount} label(s)…</button>` : \"\"}\n    </div>` : \"\"}\n    <div style=\"overflow-x:auto;margin-top:12px;\"><table class=\"rt\">\n      <thead><tr><th></th><th>Ship Date</th><th>Labels</th><th>Status</th><th></th></tr></thead>\n      <tbody>\n        ${groups.map(g=>`<tr>\n          <td>${g.unassigned>0 ? `<input type=\"checkbox\" data-select-date=\"${esc(g.date)}\" ${selectedHistoryDates.has(g.date)?\"checked\":\"\"}>` : \"\"}</td>\n          <td>${esc(g.date)}</td>\n          <td>${g.total}</td>\n          <td>${g.unassigned>0 ? `<span class=\"status-pill ADDRESS-REQUIRED\">${g.unassigned} unassigned</span>` : `<span class=\"status-pill READY\">all assigned</span>`}</td>\n          <td>${g.unassigned>0 ? `<button class=\"btn ghost small\" data-assign-date=\"${esc(g.date)}\">Assign…</button>` : \"\"}</td>\n        </tr>`).join(\"\") || `<tr><td colspan=\"5\" class=\"footnote\" style=\"padding:16px;\">No Stamps history imported yet.</td></tr>`}\n      </tbody>\n    </table></div>\n  </div>`;\n}\n\nfunction bindStampsHistoryScreen(){\n  const backBtn = document.getElementById(\"stampsHistoryBackBtn\");\n  if(backBtn) backBtn.onclick = () => { screen = currentEvent ? \"dashboard\" : \"home\"; render(); };\n  const importBtn = document.getElementById(\"importHistoryBtn\");\n  if(importBtn) importBtn.onclick = async () => {\n    // Contacts is what powers the name+address fallback match — importing\n    // history before it's loaded silently caps matching at BIB-only, with\n    // no way to undo the auto-apply afterward. Ask first, every time.\n    const coverage = await window.shipAPI.checkContactsCoverage();\n    const missing = coverage.filter(c=>!c.hasContacts);\n    if(missing.length){\n      const list = missing.map(c=>`• ${c.folderName} (${c.mode})`).join(\"\\n\");\n      const proceed = confirm(`These open event(s) don't have a Stamps Contacts file loaded yet:\\n\\n${list}\\n\\nWithout it, matching will be BIB-only (no name+address fallback) — likely fewer matches than possible. Load Contacts first for better results.\\n\\nImport anyway?`);\n      if(!proceed) return;\n    }\n    const filePath = await window.shipAPI.pickAnyFile(\"Select a Stamps history/label export CSV\");\n    if(!filePath) return;\n    stampsHistoryLastImport = await window.shipAPI.importStampsHistoryFile(filePath);\n    stampsHistory = await window.shipAPI.loadStampsHistory();\n    stampsHistoryDateGroups = await window.shipAPI.stampsHistoryDateGroups();\n    render();\n  };\n  const rerunBtn = document.getElementById(\"rerunAutoMatchBtn\");\n  if(rerunBtn) rerunBtn.onclick = async () => {\n    const res = await window.shipAPI.autoMatchStampsHistoryNow();\n    stampsHistory = await window.shipAPI.loadStampsHistory();\n    stampsHistoryDateGroups = await window.shipAPI.stampsHistoryDateGroups();\n    if(currentEvent) await refreshEventData();\n    render();\n    const sc2 = res.statusCheck || {};\n    alert(`Auto-match: ${res.autoAppliedCount} newly linked (bib match only). ${res.remaining} still unmatched.\\n\\nJust validated: ${sc2.applied||0} on a real item, ${sc2.pending||0} matched but still waiting on Apply, ${sc2.broken||0} with no runner link at all.`);\n  };\n  document.querySelectorAll(\"[data-select-date]\").forEach(cb => cb.onchange = () => {\n    const d = cb.dataset.selectDate;\n    if(cb.checked) selectedHistoryDates.add(d); else selectedHistoryDates.delete(d);\n    render();\n  });\n  const selectAllBtn = document.getElementById(\"selectAllHistoryDatesBtn\");\n  if(selectAllBtn) selectAllBtn.onclick = () => {\n    const unassigned = stampsHistoryDateGroups.filter(g=>g.unassigned>0).map(g=>g.date);\n    const allSelected = unassigned.every(d=>selectedHistoryDates.has(d));\n    selectedHistoryDates = allSelected ? new Set() : new Set(unassigned);\n    render();\n  };\n  const bulkAssignBtn = document.getElementById(\"bulkAssignBtn\");\n  if(bulkAssignBtn) bulkAssignBtn.onclick = () => openAssignModalForDates([...selectedHistoryDates]);\n  document.querySelectorAll(\"[data-assign-date]\").forEach(b => b.onclick = () => openAssignModalForDates([b.dataset.assignDate]));\n}\n\n/* ---- Assign a Stamps history date to an event + item(s) ---- */\nfunction assignModalTargetFolder(s){\n  return folders.find(f=>f.name===s.folderName);\n}\nfunction renderAssignHistoryDateModal(){\n  const s = modalState;\n  const target = assignModalTargetFolder(s);\n  return `<div class=\"modal-overlay\" id=\"modalOverlay\"><div class=\"modal\">\n    <div class=\"modal-head\"><div><h3>Assign ${esc(s.dates.join(\", \"))}</h3><p>What did ${s.dates.length>1?\"these dates'\":\"this date's\"} labels ship, and for which event?</p></div><button class=\"modal-close\" id=\"modalCloseX\">×</button></div>\n    <div class=\"modal-body\">\n      <div class=\"field-label\">Labels on this date (${s.entries.length}) <span class=\"footnote\">— look these over before picking anything</span></div>\n      <div style=\"max-height:140px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;\">\n        <table class=\"rt\"><tbody>\n          ${s.entries.map(e=>`<tr><td>${esc(e.labelName)}</td><td class=\"mono footnote\">${esc(e.trackingNumber)}</td><td class=\"footnote\">${e.bib?\"BIB \"+esc(e.bib):\"no BIB readable\"}</td></tr>`).join(\"\")}\n        </tbody></table>\n      </div>\n      ${s.suggestions.length ? `\n      <div class=\"field-label\">Suggested event <span class=\"footnote\">— based on how many of these BIBs are on each open event's roster (${s.openEventCount} event(s) currently open)</span></div>\n      <div style=\"margin-bottom:10px;\">\n        ${s.suggestions.map(sug=>`<div class=\"footnote\" style=\"display:flex;justify-content:space-between;padding:3px 0;\">\n          <span>${sug.confident?\"⭐ \":\"\"}${esc(sug.folderName)} — ${sug.mode}</span><span>${sug.matchCount}/${sug.entryBibCount} BIBs match</span>\n        </div>${sug.dateWarning?`<div class=\"warning-banner\" style=\"padding:6px 10px;font-size:0.76rem;\"><div>⚠ ${esc(sug.dateWarning)}</div></div>`:\"\"}`).join(\"\")}\n      </div>\n      ` : (s.suggestions.length===0 && folders.length ? `<div class=\"footnote\" style=\"margin-bottom:10px;\">No open event's roster matches these BIBs — pick manually below, or check whether the right event's runner list has been imported yet.</div>` : \"\")}\n      <div class=\"field-label\">Event</div>\n      <select id=\"assignEventSelect\">\n        <option value=\"\">— choose an event —</option>\n        ${folders.map(f=>`<option value=\"${esc(f.name)}\" ${s.folderName===f.name?\"selected\":\"\"}>${esc(f.name)}</option>`).join(\"\")}\n      </select>\n      <div class=\"field-label\" style=\"margin-top:10px;\">Mode</div>\n      <select id=\"assignModeSelect\">\n        <option value=\"pre-event\" ${s.targetMode===\"pre-event\"?\"selected\":\"\"}>Pre-Event</option>\n        <option value=\"post-event\" ${s.targetMode===\"post-event\"?\"selected\":\"\"}>Post-Event</option>\n      </select>\n      ${target ? `\n      <div class=\"field-label\" style=\"margin-top:10px;\">Item(s) this date's labels represent <span class=\"footnote\">— check every item that went out in this specific label/shipment</span></div>\n      <div>\n        ${itemKeyOptions(s.eventRecords).map(o=>`<label style=\"display:inline-flex;align-items:center;gap:4px;margin:2px 10px 2px 0;\">\n          <input type=\"checkbox\" data-item-key-opt=\"${esc(o.key)}\" ${s.itemKeys.includes(o.key)?\"checked\":\"\"}> ${esc(o.name)}\n        </label>`).join(\"\") || `<div class=\"footnote\">No ${s.targetMode} records loaded for this event yet.</div>`}\n      </div>\n      ` : `<div class=\"footnote\" style=\"margin-top:10px;\">Pick an event to see its items.</div>`}\n      ${s.result ? `\n      <div class=\"summary-grid\" style=\"margin-top:14px;\">\n        <div class=\"summary-item\"><div class=\"n\">${s.result.matched.length}</div><div class=\"l\">Matched</div></div>\n        <div class=\"summary-item\"><div class=\"n\">${s.result.unmatched.length}</div><div class=\"l\">Unmatched</div></div>\n      </div>\n      ${s.result.unmatched.length ? `<div class=\"warning-banner\">Unmatched rows will be logged as MATCH REVIEW REQUIRED, not silently dropped.</div>` : \"\"}\n      ` : \"\"}\n    </div>\n    <div class=\"modal-foot\">\n      <span>${s.result ? `<button class=\"btn ghost small\" id=\"exportMatchReportBtn\">Export match report</button>` : \"\"}</span>\n      <span style=\"display:flex;gap:8px;\">\n        ${target && s.itemKeys.length ? `<button class=\"btn ghost small\" id=\"previewAssignBtn\">Preview match</button>` : \"\"}\n        ${s.result ? `<button class=\"btn primary small\" id=\"applyAssignBtn\">Apply ${s.result.matched.length} match(es)</button>` : \"\"}\n      </span>\n    </div>\n  </div></div>`;\n}\n\n// Item choices come from whatever's actually on this event's records for the\n// chosen mode (so ad hoc items show up too), not a hardcoded list.\nfunction itemKeyOptions(eventRecords){\n  const seen = new Map();\n  for(const r of eventRecords) for(const it of r.items) if(!seen.has(it.key||it.name)) seen.set(it.key||it.name, it.name);\n  return Array.from(seen, ([key,name])=>({key,name}));\n}\n\nfunction bindAssignHistoryDateModal(){\n  const s = modalState;\n  const evSel = document.getElementById(\"assignEventSelect\");\n  if(evSel) evSel.onchange = async () => {\n    s.folderName = evSel.value;\n    s.itemKeys = []; s.result = null;\n    const f = assignModalTargetFolder(s);\n    s.eventRec
