<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citytri Shipment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F7F5F1; --surface:#FFFFFF; --surface-2:#FBF9F5;
    --ink:#1E1B16; --ink-dim:#6B6459; --ink-faint:#9B9284;
    --accent:#1F6F78; --accent-ink:#FFFFFF; --accent-2:#E8532A;
    --line:#E4DFD5; --line-strong:#D2CABC;
    --good:#2F7D4F; --good-bg:#E7F2EA;
    --warn:#9A6B12; --warn-bg:#FBEFDB;
    --bad:#B23A2E; --bad-bg:#FBE7E3;
    --shadow: 0 1px 2px rgba(30,27,22,0.06), 0 8px 24px -12px rgba(30,27,22,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17140F; --surface:#201C16; --surface-2:#231F19;
      --ink:#F3EEE4; --ink-dim:#B0A692; --ink-faint:#7C7362;
      --accent:#5FC2CC; --accent-ink:#0B1E1F; --accent-2:#FF7A4D;
      --line:#39332A; --line-strong:#4A4234;
      --good:#6FCB93; --good-bg:#1C2E22;
      --warn:#E7B75C; --warn-bg:#332811;
      --bad:#FF8A78; --bad-bg:#3A1E19;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17140F; --surface:#201C16; --surface-2:#231F19;
    --ink:#F3EEE4; --ink-dim:#B0A692; --ink-faint:#7C7362;
    --accent:#5FC2CC; --accent-ink:#0B1E1F; --accent-2:#FF7A4D;
    --line:#39332A; --line-strong:#4A4234;
    --good:#6FCB93; --good-bg:#1C2E22;
    --warn:#E7B75C; --warn-bg:#332811;
    --bad:#FF8A78; --bad-bg:#3A1E19;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Karla', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display{ font-family:'Oswald', 'Arial Narrow', sans-serif; text-transform:uppercase; letter-spacing:0.02em; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  /* Chromium's UA stylesheet gives <button> its own default text color
     (doesn't inherit from body like other elements) — every custom button in
     this app (event-row, chips, action-cards, wordmark) relies on inheriting
     the theme's ink color, so reset it here once rather than per-class. */
  button{ font-family:inherit; color:inherit; }
  a{ color:var(--accent-2); }

  /* height (not min-height) caps .app at the viewport, so .layout's children
     (sidebar/main) scroll independently within it instead of the whole page
     growing taller than the window and scrolling as one — which was
     dragging the sidebar out of view along with the records table. */
  .app{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  /* #root (plain div, filled by render()) must itself be a flex container
     with min-height:0 for .layout's flex:1 to have anything to flex within —
     without this, the height:100vh above just clips content instead of
     making it scrollable, since the constraint never reaches .layout. */
  #root{ flex:1; min-height:0; display:flex; flex-direction:column; }
  #root > .layout{ flex:1; min-height:0; }
  #root > .home, #root > .setup-screen{ flex:1; min-height:0; overflow-y:auto; }
  .topbar{ display:flex; align-items:center; gap:14px; padding:9px 24px; border-bottom:1px solid var(--line); background:var(--surface); }
  .wordmark{ display:flex; align-items:baseline; gap:8px; background:none; border:none; cursor:pointer; padding:0; }
  .wordmark .flag{ font-size:1.1rem; }
  .wordmark h1{ font-size:1.15rem; font-weight:700; letter-spacing:0.03em; color:var(--ink); }
  .sub{ font-size:0.72rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em; }
  .topbar-spacer{ flex:1; }
  .btn{ appearance:none; border:none; border-radius:9px; padding:9px 16px; font-size:0.82rem; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:0.04em; font-family:'Karla',sans-serif; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.warn{ background:var(--accent-2); color:#fff; }
  .btn.ghost{ background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong); }
  .btn.ghost:hover{ border-color:var(--accent); color:var(--ink); }
  .btn.small{ padding:5px 11px; font-size:0.72rem; border-radius:7px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }

  .layout{ flex:1; display:grid; grid-template-columns:360px 1fr; min-height:0; }
  /* Reversible, not a real tradeoff — the sidebar (event name, status
     stats, workflow buttons) is only ever hidden until toggled back; toggle
     state lives in memory only, so it starts expanded again each launch. */
  .layout.sidebar-collapsed{ grid-template-columns:1fr; }
  .layout.sidebar-collapsed > .sidebar{ display:none; }
  /* ============ Tablet + phone (<=960px): per
     docs/Claude_Tablet_Mobile_UI_Protocol.md — TWO MUTUALLY-EXCLUSIVE
     FULL-WIDTH STATES, not a side-by-side squeeze. Direct requirement:
     "The records list and expanded runner details must not be squeezed
     beside this panel." This supersedes the earlier tablet side-column
     attempt (220px sidebar + table) at this same breakpoint — that version
     is gone. Desktop (>960px) is completely untouched by anything below:
     .layout's base grid rule above still applies there exactly as before,
     and none of these rules can match at desktop widths.

     Reuses the exact same sidebarCollapsed state/toggle already built for
     desktop — nothing new in JS. Default (not collapsed) shows the event
     workspace (.sidebar) only, full width; toggling ☰ hides it and shows
     the operational area (.main) instead, also full width. The general
     ".layout.sidebar-collapsed > .sidebar{display:none}" rule above already
     covers "hide the sidebar when toggled" at every width, so it isn't
     repeated here — only the narrow-width-specific pieces are added. */
  @media (max-width:960px){
    .layout{ display:block; overflow-y:auto; }
    .layout .sidebar{ overflow-y:visible; width:100%; }
    .layout .main{ overflow-y:visible; display:none; }
    .layout.sidebar-collapsed .main{ display:block; }
    .records-filter-head{ position:static; }
    .topbar{ flex-wrap:wrap; row-gap:6px; }
    .topbar .wordmark{ flex-basis:100%; }
    /* Status and Workflow side by side when the width allows it (tablet),
       per spec: "Status and Workflow may use two balanced columns when the
       width permits." Reverts to plain stacking below 600px — confirmed
       too cramped for two real columns at phone width. */
  }
  @media (min-width:600px) and (max-width:960px){
    .sidebar-status-workflow{ display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:start; }
  }
  /* Records: the desktop table is genuinely desktop-only now — showing it
     at tablet width just because it happened to fit was resizing the
     desktop solution, not designing for tablet (direct correction; the
     protocol is explicit: tablet is "not... a compressed desktop"). Both
     tablet and phone get the same purpose-built list view instead, built
     around the protocol's own prioritized field set (BIB, name, placing,
     items, address/shipment status — email demoted to the expanded detail
     only). .records-card-view is always rendered by JS regardless of
     width — only CSS decides which view shows, so there is no JavaScript
     branching on viewport width. */
  .records-card-view{ display:none; }
  @media (max-width:960px){
    .records-table-view{ display:none; }
    .records-card-view{ display:block; }
  }
  .record-card{ background:var(--surface); border:1px solid var(--line); border-left:4px solid transparent; border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; flex-direction:column; gap:6px; cursor:pointer; }
  .record-card.open{ border-color:var(--accent); }
  .record-card-head{ display:flex; align-items:center; gap:10px; }
  .record-card-head input[type="checkbox"]{ flex:none; }
  .record-card-name{ font-weight:700; flex:1; }
  .record-card-chevron{ color:var(--ink-faint); flex:none; }
  .record-card-detail{ background:var(--surface-2); border-radius:10px; padding:16px 14px; margin:-4px 0 8px; }
  /* min-width:0 matters here, not just min-height:0 — a CSS Grid track
     sized with 1fr still has an implicit minimum equal to its content's
     min-content width unless the item explicitly allows shrinking below
     that. Without it, at a narrow single-column width the track gets
     forced wide enough to fit whatever's least breakable inside (a table,
     usually), instead of the real available width — confirmed directly:
     774px wide inside a 390px viewport before this was added. */
  .sidebar{ border-right:1px solid var(--line); background:var(--surface-2); padding:16px 14px 24px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; min-height:0; min-width:0; }
  .main{ padding:22px 26px 40px; overflow-y:auto; display:flex; flex-direction:column; gap:20px; min-height:0; min-width:0; }

  .home{ padding:32px 28px 40px; overflow-y:auto; display:flex; flex-direction:column; gap:22px; flex:1; }
  .event-bucket-title{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-faint); font-weight:700; margin:18px 0 8px; }
  .event-list{ background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .event-row{ display:flex; align-items:center; gap:14px; padding:9px 16px; background:transparent; border:none; border-bottom:1px solid var(--line); cursor:pointer; text-align:left; width:100%; font-size:0.86rem; }
  .event-row:last-child{ border-bottom:none; }
  .event-row:hover{ background:var(--surface-2); }
  .event-row .num{ font-family:'IBM Plex Mono',monospace; color:var(--ink-faint); width:2.4em; flex:none; }
  .event-row .name{ font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .event-row .meta{ font-size:0.78rem; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; flex:none; }

  .setup-screen{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px; }
  .setup-card{ max-width:520px; text-align:center; display:flex; flex-direction:column; gap:16px; align-items:center; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
  .card-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap; }
  .card-head h3{ font-size:0.9rem; letter-spacing:0.04em; }
  .card-body{ padding:16px 18px 18px; }
  /* Scoped to the Records table's own filter header only — .card-head
     itself stays untouched since every other card on every screen shares
     that class. Sticks to the top of .main's own scroll (same mechanism
     .bulkbar already uses at the bottom), so the search/filter/distance
     controls stay reachable without following the whole card upward.
     top is -22px, not 0 — .main's own 22px top padding doesn't scroll away
     (it's part of the scrollport, not the scrolled content), so a plain
     top:0 rests 22px below .main's real edge. That gap let a table row's
     top sliver render above the sticky bar since it's still technically
     inside .main's clip region. Negative top by that exact amount closes
     the gap so the header sits flush and nothing shows above it. */
  .records-filter-head{ position:sticky; top:-22px; z-index:6; background:var(--surface); box-shadow:0 4px 10px -6px rgba(0,0,0,0.35); }

  .action-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:800px){ .action-grid{ grid-template-columns:1fr; } }
  .action-card{ text-align:left; background:var(--surface); border:1px solid var(--line); border-top:4px solid var(--accent); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; cursor:pointer; display:flex; flex-direction:column; gap:8px; }
  .action-card:hover{ border-color:var(--accent); }
  .action-card .kicker{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint); font-weight:700; }
  .action-card .title{ font-family:'Oswald',sans-serif; font-size:1.05rem; }
  .action-card .desc{ font-size:0.8rem; color:var(--ink-dim); line-height:1.4; }

  .stat-strip{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat-pill{ background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:6px 13px; font-size:0.76rem; color:var(--ink-dim); display:flex; gap:6px; align-items:center; }
  .stat-pill b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-dim); font-size:0.74rem; padding:5px 10px; border-radius:999px; cursor:pointer; }
  .chip:hover{ border-color:var(--accent); color:var(--ink); }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }

  table.rt{ width:100%; border-collapse:collapse; font-size:0.82rem; }
  table.rt th{ text-align:left; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line-strong); }
  table.rt td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.rt tr.selected{ background:color-mix(in srgb, var(--accent) 8%, transparent); }
  table.rt tr:hover{ background:var(--surface-2); }
  /* Solid fill + white text, not tinted-bg/tinted-text — the tinted pairing
     read as low-contrast/near-black on some displays. */
  .status-pill{ display:inline-block; padding:2px 9px; border-radius:6px; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:#fff; }
  .status-pill.READY, .status-pill.SHIPPED{ background:var(--good); color:#0b1f13; }
  .status-pill.ADDRESS-REQUIRED, .status-pill.MISSING-ADDRESS, .status-pill.NOT-STARTED{ background:var(--warn); color:#241a02; }
  .status-pill.ADDRESS-REVIEW-REQUIRED, .status-pill.MATCH-REVIEW-REQUIRED{ background:var(--bad); color:#2a0c07; }
  .item-badge{ display:inline-flex; align-items:center; gap:4px; font-size:0.7rem; padding:2px 7px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line-strong); margin:1px 3px 1px 0; }
  .item-badge.shipped{ background:var(--good-bg); color:var(--good); border-color:transparent; text-decoration:line-through; }

  .data-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:12px 16px; }
  .field-label{ font-size:0.64rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-faint); margin-bottom:3px; }
  .field-value{ font-size:0.9rem; font-weight:600; }
  select, input[type="text"]{ font-family:'Karla',sans-serif; font-size:0.84rem; padding:7px 10px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); width:100%; box-sizing:border-box; }
  input[type="checkbox"]{ width:16px; height:16px; }
  label.f{ display:flex; flex-direction:column; gap:4px; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); font-weight:700; }

  .item-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .item-row:last-child{ border-bottom:none; }
  .item-row .iname{ font-weight:700; font-size:0.86rem; min-width:170px; }
  .item-row input[data-item-track]{ max-width:none; width:26ch; font-family:'IBM Plex Mono',monospace; }
  .item-row input[data-item-date]{ max-width:120px; }
  /* flex-wrap:wrap is harmless at desktop width — there's always enough
     room there, so it never actually wraps; only narrow viewports need it,
     confirmed real overflow: 712px of content in a 390px-wide detail
     panel before this was added. */
  .apply-all-box{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; padding:10px 12px; background:var(--surface-2); border:1px solid var(--accent); border-radius:10px; }
  .apply-all-box input[type="text"]{ font-family:'IBM Plex Mono',monospace; }
  .track-link{ font-size:0.72rem; color:var(--accent-2); text-decoration:none; white-space:nowrap; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(20,17,12,0.55); display:flex; align-items:flex-start; justify-content:center; padding:5vh 20px; overflow-y:auto; z-index:50; }
  .modal{ background:var(--surface); border-radius:16px; border:1px solid var(--line); box-shadow:0 24px 60px -20px rgba(0,0,0,0.45); width:100%; max-width:760px; display:flex; flex-direction:column; }
  .modal-head{ padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .modal-head h3{ font-size:1.1rem; }
  .modal-head p{ margin:4px 0 0; font-size:0.8rem; color:var(--ink-dim); }
  .modal-close{ background:none; border:none; color:var(--ink-faint); font-size:1.3rem; cursor:pointer; line-height:1; padding:2px 6px; }
  .modal-body{ padding:18px 22px; display:flex; flex-direction:column; gap:16px; max-height:70vh; overflow-y:auto; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .summary-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .summary-item{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .summary-item .n{ font-family:'IBM Plex Mono',monospace; font-size:1.3rem; font-weight:600; }
  .summary-item .l{ font-size:0.68rem; text-transform:uppercase; color:var(--ink-faint); letter-spacing:0.05em; }
  .warning-banner{ display:flex; flex-direction:column; gap:8px; background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:0.82rem; }
  .warning-actions{ display:flex; gap:8px; }
  .stamps-lock{ font-size:0.78rem; color:var(--good); font-weight:700; display:flex; align-items:center; gap:5px; }
  .footnote{ font-size:0.76rem; color:var(--ink-faint); line-height:1.6; }
  .bulkbar{ position:sticky; bottom:0; background:var(--surface); border:1px solid var(--accent); border-radius:12px; padding:10px 16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); }
</style>

<div class="app">
  <header class="topbar">
    <button class="wordmark" id="homeBtn"><span class="flag">📦</span><h1>Citytri Shipment Tracker</h1></button>
    <span class="sub" id="crumbSub">Race merchandise shipment tracking</span>
    <div class="topbar-spacer"></div>
    <button class="btn ghost" id="toggleSidebarBtn" title="Show/hide the event sidebar">☰</button>
    <button class="btn ghost" id="changeLibBtn" title="Change the library root folder">📁</button>
  </header>
  <div id="root"></div>
</div>
<div id="modalRoot"></div>

<script>
/* ================= date helpers ================= */
// Folders are entirely user-named/created — there is no formula mapping a
// master-calendar event to a folder. calendarEvents is only a reference list
// for OPTIONALLY linking a folder to a known date (see .event-meta.json).
let calendarEvents = [];
let folders = [];
const today = new Date(); today.setHours(0,0,0,0);
function daysOut(dateStr){ return Math.round((new Date(dateStr) - today) / 86400000); }
function hasOccurred(dateStr){ return new Date(dateStr) < today; }
function nowLocal(){ return new Date().toLocaleString(undefined, { dateStyle:"short", timeStyle:"short" }); }
function todayIso(){ return new Date().toISOString().slice(0,10); }

/* ================= tiny helpers duplicated from lib/pipeline.js for display only ================= */
// One tracking number on ANY item is enough to call the record SHIPPED — no
// partial state. Matches lib/pipeline.js's computeRecordStatus (duplicated
// here since the renderer can't require() a Node module).
function computeRecordStatus(r){
  return r.items.some(i=>i.trackingNumber) ? "SHIPPED" : "NOT STARTED";
}
function pillClass(s){ return s.replace(/ /g,"-"); }
// A status that means a REAL shipment ran into a real problem after it
// actually went out — not "Refunded" (that's a voided label that never
// shipped at all, excluded upstream in mergeStampsHistory, never even
// reaches an item) but a package that shipped and then came back or needs
// the shipper's attention.
const SHIPMENT_STATUS_NEEDS_REVIEW = ["undeliverable", "action required"];
function needsShipmentReview(status){ return SHIPMENT_STATUS_NEEDS_REVIEW.includes(String(status||"").toLowerCase()); }
function rankDisplay(v){ const n = Number(v); return Number.isFinite(n) && n>0 ? "#"+n : "—"; }
function placingText(r){
  if(r.mode!=="post-event") return `<span class="footnote">${esc(r.division)||"—"}</span>`;
  const g = Number(r.rankGender), d = Number(r.rankDivision);
  const isGenderTop3 = g>=1 && g<=3, isDivTop3 = d>=1 && d<=3;
  return `<div style="font-size:0.82rem;">${esc(r.division)||"—"}</div>
    <div class="footnote">Gender ${isGenderTop3?`<b style="color:var(--good);">${rankDisplay(g)}</b>`:rankDisplay(g)} · Div ${isDivTop3?`<b style="color:var(--good);">${rankDisplay(d)}</b>`:rankDisplay(d)} · Overall ${rankDisplay(r.rankOverall)}</div>`;
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// Recognized carrier tracking-number shapes — USPS (20-22 digit), UPS
// (1Z + 16 alphanumeric), FedEx (12 or 15 digit). Anything else isn't a
// real tracking number, hand-typed or not.
function isValidTrackingNumber(s){
  const n = String(s||"").replace(/\s+/g,"");
  return /^\d{20,22}$/.test(n) || /^1Z[0-9A-Z]{16}$/.test(n) || /^\d{12}$/.test(n) || /^\d{15}$/.test(n);
}
function trackingCarrierUrl(s){
  const n = String(s||"").replace(/\s+/g,"");
  if(!isValidTrackingNumber(n)) return null;
  // Stamps.com is the actual system of record for every label this app
  // deals with — its own tracking-details lookup resolves reliably for
  // labels it generated. The carrier's own public tracking page (USPS's
  // especially) can fail on the exact same number — confirmed directly,
  // 2026-09-16 — so route through Stamps instead of guessing per carrier.
  return `https://www.stamps.com/tracking-details/?t=${encodeURIComponent(n)}`;
}
function trackButton(num){
  const url = trackingCarrierUrl(num);
  // Text label, not an emoji/icon-only glyph — the packaged app doesn't
  // reliably render color emoji, so an icon-only button can end up
  // showing as an unrecognizable dot instead of a clickable control.

}

function isStampsHistoryFile(filename){

function detectModeHint(filename){
  const base = filename.replace(/\.[^.]+$/,"");
  if(/^Start list_BIB_Download/i.test(base)) return "→ Pre-Event";
  if(/^ActiveResults_TShirt_address.*_Cleaned$/i.test(base)) return "→ Post-Event";
  if(/^ActiveResults_TShirt_address/i.test(base)) return "⚠ uncleaned — will be rejected";
  if(isStampsHistoryFile(filename)) return "→ Stamps History (shared across every event, not just this one)";
  return "unrecognized filename";
}

async function loadContactsFile(){

// Golden rule, direct instruction: "DATA MODIFICATIONS LIVE IN THE LOGS.
// LOGS ARE THE LAW." Every action that changes persisted data calls this.
async function logAudit(type, detail){
  await window.shipAPI.appendAudit(currentEvent.folderPath, { at: new Date().toISOString(), type, mode, ...detail });
}

function modeRecords(){ return records.filter(r=>r.mode===mode); }
function availableRaces(){ return [...new Set(modeRecords().map(r=>r.race).filter(Boolean))].sort(); }
// Real freeze found on real data (411 records): emailGroupSize used to
// re-filter the full record list on every single call, and groupColor
// called it ONCE PER RECORD inside its own filter — an accidental O(n^2)
// cost per call to groupColor, which itself is called ~3x per row. That's
// ~200 million redundant operations for one render, enough to hang the app
// solid. Fixed by building the email -> count map exactly ONCE per render
// (invalidated in render(), see below) and having every group-related
// helper do an O(1) lookup into it instead of re-scanning every time.
let _groupIndexCache = null;
function getGroupIndex(){
  if(_groupIndexCache) return _groupIndexCache;
  const counts = new Map();
  for(const r of records){
    if(r.mode!==mode) continue;
    const e = (r.email||"").toLowerCase();
    if(!e) continue;
    counts.set(e, (counts.get(e)||0)+1);
  }
  _groupIndexCache = counts;
  return counts;
}
// How many OTHER records (same mode) share this email — the point is
// spotting a family so their items can be shipped together, not flagging
// a data error. A blank email never counts as a "group."
function emailGroupSize(email){
  if(!email) return 1;
  return getGroupIndex().get(email.toLowerCase()) || 1;
}
// 16 deliberately-spread hues, not a raw hash — a plain hash-mod-360 let two
// unrelated families land on the same or near-same color purely by chance
// once a real event had more than a handful of groups (confirmed on real
// data: two different families both landed on the same blue). Assigning
// from a fixed palette, in a stable sorted order across every group
// currently in view, guarantees no two groups share a color until every
// slot in the palette is used at least twice. Built once per render (see
// _groupIndexCache above), not recomputed per row.
const GROUP_COLOR_PALETTE = ["#E63946","#457B9D","#2A9D8F","#E9C46A","#F4A261","#8E44AD","#06A77D","#D62828","#3A86FF","#FB5607","#8338EC","#43AA8B","#FF006E","#219EBC","#FFB703","#6A4C93"];
let _groupColorMapCache = null;
function getGroupColorMap(){
  if(_groupColorMapCache) return _groupColorMapCache;
  const groupedEmails = [...getGroupIndex().entries()].filter(([,c])=>c>1).map(([e])=>e).sort();
  const map = new Map();
  groupedEmails.forEach((e,i) => map.set(e, GROUP_COLOR_PALETTE[i % GROUP_COLOR_PALETTE.length]));
  _groupColorMapCache = map;
  return map;
}
function groupColor(email){
  if(!email || emailGroupSize(email)<=1) return null;
  return getGroupColorMap().get(email.toLowerCase()) || null;
}
// Ported from Waiver_Audit_7.py's primary_name_score/assign_primary_flags —
// same scoring, same "never guess when it's a tie" rule. Adults only.
function normalizedNamePart(v){ return String(v||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
function primaryNameScore(person, email){
  const localPart = normalizedNamePart((email||"").split("@")[0]);
  const first = normalizedNamePart(person.firstName), last = normalizedNamePart(person.lastName);
  if(!localPart) return 0;
  let score = 0;
  if(first && last && (localPart.includes(first+last) || localPart.includes(last+first))) score += 20;
  if(first.length>=4 && localPart.includes(first)) score += 8;
  else if(first.length>=3 && localPart.includes(first.slice(0,3))) score += 2;
  if(last.length>=4 && localPart.includes(last)) score += 8;
  else if(last.length>=3 && localPart.includes(last.slice(0,3))) score += 3;
  if(first && last && localPart.includes(first[0]+last)) score += 6;
  return score;
}
function emailGroupRecords(email){
  if(!email) return [];
  const e = email.toLowerCase();
  return modeRecords().filter(r=>(r.email||"").toLowerCase()===e);
}
// Unambiguous auto-detection only — a lone adult wins automatically, a
// clear best-scoring adult wins, a tie or zero score picks nobody.
function autoDetectedPrimaryBib(email){
  const group = emailGroupRecords(email);
  const adults = group.filter(r=>Number(r.age)>=18);
  if(adults.length===1) return adults[0].bib;
  if(adults.length<=1) return null;
  const scored = adults.map(r=>({bib:r.bib, score:primaryNameScore(r, email)}));
  const best = Math.max(...scored.map(s=>s.score));
  const bestOnes = scored.filter(s=>s.score===best);
  return (best>0 && bestOnes.length===1) ? bestOnes[0].bib : null;
}
// Manual override always wins over auto-detection.
function effectivePrimaryBib(email){
  const group = emailGroupRecords(email);
  const manual = group.find(r=>r.isGroupPrimary===true);
  return manual ? manual.bib : autoDetectedPrimaryBib(email);
}
async function setGroupPrimary(bib){
  const target = records.find(r=>r.bib===bib && r.mode===mode);
  const email = (target?.email||"").toLowerCase();
  if(!email) return;
  for(const r of emailGroupRecords(email)) r.isGroupPrimary = (r.bib===bib);
  await persistRecords();
  await logAudit("group-primary-set", { bib, email });
  render();
}
async function unsetGroupPrimary(bib){
  const r = records.find(x=>x.bib===bib && x.mode===mode);
  if(r) r.isGroupPrimary = false;
  await persistRecords();
  await logAudit("group-primary-unset", { bib });
  render();
}
function visibleRecords(){
  let list = modeRecords();
  if(filterRaces.size) list = list.filter(r=>filterRaces.has(r.race));
  // Stacked status chips — every checked one must hold (AND), not just any one.
  if(filterStatuses.has("ready")) list = list.filter(r=>r.addressStatus==="READY");
  if(filterStatuses.has("addressRequired")) list = list.filter(r=>r.addressStatus==="MISSING ADDRESS");
  if(filterStatuses.has("addressReview")) list = list.filter(r=>r.addressStatus==="ADDRESS REVIEW REQUIRED");
  if(filterStatuses.has("shipped")) list = list.filter(r=>computeRecordStatus(r)==="SHIPPED");
  if(filterStatuses.has("notStarted")) list = list.filter(r=>computeRecordStatus(r)==="NOT STARTED");
  if(filterStatuses.has("top3")) list = list.filter(r=>r.items.some(i=>i.name.includes("Award")));
  if(filterStatuses.has("validated")) list = list.filter(r=>r.stampsValidated);
  if(filterStatuses.has("grouped")) list = list.filter(r=>emailGroupSize(r.email)>1);
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(r => r.bib.toLowerCase().includes(q) || `${r.firstName} ${r.lastName}`.toLowerCase().includes(q) || (r.email||"").toLowerCase().includes(q));
  }
  // Grouped-by-email records are forced to the top, ahead of everything
  // else — the point is deciding whether to ship a family's items as one
  // combined package, so those rows need to be seen first, not buried
  // alphabetically among hundreds of unrelated singles. Within a group, the
  // Primary (if one's set) leads, then the rest of that family by last name.
  list = [...list].sort((a,b) => {
    const ga = emailGroupSize(a.email) > 1 ? 0 : 1, gb = emailGroupSize(b.email) > 1 ? 0 : 1;
    if(ga !== gb) return ga - gb;
    const ea = (a.email||"").toLowerCase(), eb = (b.email||"").toLowerCase();
    if(!ea && !eb) return (a.lastName||"").localeCompare(b.lastName||"");
    if(!ea) return 1;
    if(!eb) return -1;
    if(ea !== eb) return ea.localeCompare(eb);
    const pa = effectivePrimaryBib(a.email)===a.bib ? 0 : 1, pb = effectivePrimaryBib(b.email)===b.bib ? 0 : 1;
    if(pa !== pb) return pa - pb;
    return (a.lastName||"").localeCompare(b.lastName||"");
  });
  return list;
}

/* ================= render dispatch ================= */
function render(){
  // Fresh group-index/color computation exactly once for this render pass
  // — see getGroupIndex/getGroupColorMap above. Must be invalidated here,
  // not left stale across renders, since records/mode can change.
  _groupIndexCache = null;
  _groupColorMapCache = null;
  // Full innerHTML re-render (same idiom as Startline) loses focus/cursor
  // position on every keystroke for any live-typing input (search box) unless
  // explicitly restored — save it before redrawing, restore it after.
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  // Same problem as focus: replacing .main's innerHTML resets its scroll to
  // the top on every render — so clicking a row far down a long table threw
  // the operator back to row 1. Capture and restore it like focus above.
  const mainEl = document.querySelector(".main");
  const mainScrollTop = mainEl ? mainEl.scrollTop : 0;

  document.getElementById("crumbSub").textContent = appVersion ? `v${appVersion}` : "Race merchandise shipment tracking";
  // The sidebar only exists on the event workspace screen — the toggle is
  // meaningless (and hidden) anywhere else, same as the user's own framing:
  // "the sidebar is event specific."
  document.getElementById("toggleSidebarBtn").style.display = (screen==="dashboard" && currentEvent) ? "" : "none";
  if(screen==="setup") rootEl.innerHTML = renderSetup();
  else if(screen==="home") rootEl.innerHTML = renderHome();
  else if(screen==="stampsHistory") rootEl.innerHTML = renderStampsHistoryScreen();
  else rootEl.innerHTML = renderDashboard();
  bindShellEvents();
  modalRootEl.innerHTML = modalState ? renderModal() : "";
  if(modalState) bindModalEvents();

  const newMainEl = document.querySelector(".main");
  if(newMainEl) newMainEl.scrollTop = mainScrollTop;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch{} }
    }
  }
}

async function openStampsHistoryScreen(){
  screen = "stampsHistory";
  stampsHistory = await window.shipAPI.loadStampsHistory();
  stampsHistoryDateGroups = await window.shipAPI.stampsHistoryDateGroups();
  folders = await window.shipAPI.listEventFolders(); // for the assign-date event picker
  render();
}

let selectedHistoryDates = new Set(); // ship dates checked in the Stamps History table, for bulk assign

async function openAssignModalForDates(dates){
  const entries = stampsHistory.filter(h => dates.includes(h.shipDate) && !h.assignment);
  modalState = { type:"assignHistoryDate", dates, step:1, folderName:"", targetMode:"post-event", itemKeys:[], eventRecords:[], result:null, entries, suggestions:[], openEventCount:0 };
  render();
  // Fetch after the first paint so the label preview shows immediately —
  // exactly what was asked for: recognize the batch before being asked to
  // pick anything, not guess blind from a dropdown.
  const { suggestions, openEventCount } = await window.shipAPI.suggestEventForDates(dates);
  if(modalState !== null && modalState.dates === dates){
    modalState.suggestions = suggestions;
    modalState.openEventCount = openEventCount;
    const top = suggestions[0];
    // Auto-fill the event+mode only when the evidence is genuinely
    // one-sided (one open event, or one dominant match) — the operator
    // still has to say what item(s) this batch was, and can always
    // override the event/mode pick below.
    if(top && top.confident){
      modalState.folderName = top.folderName;
      modalState.targetMode = top.mode;
      const f = folders.find(x=>x.name===top.folderName);
      modalState.eventRecords = f ? (await window.shipAPI.loadRecords(f.folderPath)).filter(r=>r.mode===top.mode) : [];
    }
    render();
  }
}

  const selectedLabelCount = unassignedGroups.filter(g=>selectedHistoryDates.has(g.date)).reduce((n,g)=>n+g.unassigned,0);
  const allSelected = unassignedGroups.length>0 && unassignedGroups.every(g=>selectedHistoryDates.has(g.date));
  return `<div class="home">

        <button class="btn primary small" id="importHistoryBtn">📄 Import Stamps history export</button>

function bindStampsHistoryScreen(){

// Item choices come from whatever's actually on this event's records for the
// chosen mode (so ad hoc items show up too), not a hardcoded list.
function itemKeyOptions(eventRecords){
  const seen = new Map();
  for(const r of eventRecords) for(const it of r.items) if(!seen.has(it.key||it.name)) seen.set(it.key||it.name, it.name);
  return Array.from(seen, ([key,name])=>({key,name}));
}

    const trackingNumber = (document.getElementById("bulkShipTrackInput").value||"").trim();
    if(!trackingNumber){ alert("Enter a tracking number first."); return; }
    if(!isValidTrackingNumber(trackingNumber)){ alert(`Doesn't look like a real tracking number: ${trackingNumber}\n\nExpected a USPS (20-22 digit), UPS ("1Z..."), or FedEx (12 or 15 digit) tracking number.`); return; }
    const note = (document.getElementById("bulkShipNoteInput").value||"").trim();
    const today = todayIso();

        it.trackingNumber = trackingNumber; it.shippedDate = today; it.delivered = false;

    closeModal();
    selected = new Set();
    render();
    alert(`Applied to ${affected.length} item(s) across the selection.`);
  };
}

/* ---- Update Shipment Status: 3 steps — choose an action, define group(s) if building a population, review ---- */
const WORKFLOW_POPULATION_LABEL = { "all":"All Finishers", "top3-overall":"Top 3 Overall", "top3-agegroup":"Top 3 Age Group", "person":"Specific person" };
function workflowPopulationRecords(population, searchName){
  const mr = modeRecords();
  if(population==="top3-overall") return mr.filter(r=>r.items.some(i=>(i.key||i.name)==="gender-award"));
  if(population==="top3-agegroup") return mr.filter(r=>r.items.some(i=>(i.key||i.name)==="division-award"));
  if(population==="person"){
    const q = (searchName||"").trim().toLowerCase();
    if(!q) return [];
    return mr.filter(r=>r.bib===q || `${r.firstName} ${r.lastName}`.toLowerCase().includes(q));
  }
  return mr; // "all"
}
// Display-only summary of a group — always resolves item keys to their real
// current name (never a hardcoded label, never a raw key like "finisher-medal").
// Shows the FULL set of items a runner in this group actually ends up with,
// not just this group's own checked boxes — a Top 3 Overall runner is also
// an All Finishers runner, so their line shows Medal+T-Shirt+Award, not just
// the Award, which is all this group alone would otherwise seem to say.
function workflowGroupSummary(g, allGroups){
  const recs = workflowPopulationRecords(g.population, g.searchName);
  const opts = itemKeyOptions(recs.length?recs:modeRecords());
  const recBibs = new Set(recs.map(r=>r.bib));
  const unionKeys = new Set(g.itemKeys);
  for(const other of (allGroups||[])){
    if(other===g) continue;
    const otherRecs = workflowPopulationRecords(other.population, other.searchName);
    if(otherRecs.some(r=>recBibs.has(r.bib))) other.itemKeys.forEach(k=>unionKeys.add(k));
  }
  const itemNames = [...unionKeys].map(k=>(opts.find(o=>o.key===k)||{}).name || k);
  const who = g.population==="person" ? `"${g.searchName}"` : WORKFLOW_POPULATION_LABEL[g.population];
  return { recs, itemNames, who };
}

      <span style="display:flex;gap:8px;">
        ${s.step===2 ? `<button class="btn ghost small" id="wfSkipBtn">Skip — just update statuses</button><button class="btn primary small" id="wfStep2NextBtn" ${s.groups.length?"":"disabled"}>Next → (${s.groups.length} group(s))</button>` : ""}
        ${s.step===3 && s.applyResult ? `<button class="btn primary small" id="wfDoneBtn">Done</button>` : ""}
        ${s.step===3 && !s.applyResult ? `<button class="btn primary small" id="wfApplyGroupsBtn" ${s.applying?"disabled":""}>${s.applying?"Applying…":"Apply items to matched shipments"}</button>` : ""}
      </span>
    </div>
  </div></div>`;
}

function bindShipmentWorkflowModal(){
  const s = modalState;
  if(s.step===1){
    const goMatch = document.getElementById("wfGoMatchBtn");
    if(goMatch) goMatch.onclick = async () => {
      const coverage = await window.shipAPI.checkContactsCoverage();
      const missing = coverage.filter(c=>!c.hasContacts);
      if(missing.length){
        const list = missing.map(c=>`• ${c.folderName} (${c.mode})`).join("\n");
        const proceed = confirm(`These open event(s) don't have a Stamps Contacts file loaded yet:\n\n${list}\n\nWithout it, matching will be BIB-only — likely fewer matches than possible.\n\nImport anyway?`);
        if(!proceed) return;
      }
      const filePath = await window.shipAPI.pickAnyFile("Select a Stamps history/label export CSV");
      if(!filePath) return;
      s.matching = true; render();
      const res = await window.shipAPI.importStampsHistoryFile(filePath);
      await refreshEventData();
      s.matching = false;
      const sc = res.statusCheck || {};
      alert(`${res.added} new label(s) added, ${res.duplicate} already recorded. ${res.autoAppliedCount} runner(s) newly linked to a tracking number just now (bib match only — no item/status change yet); ${res.remaining} still need review across all events.\n\nJust validated, across every event: ${sc.applied||0} tracking number(s) are actually on a real item, ${sc.pending||0} are matched to a runner but still waiting on the Apply step, ${sc.broken||0} have no runner link at all and need attention.\n\nNext, say what this batch is shipping.`);
      s.step = 2;
      render();
    };
  }
  if(s.step===2){
    document.querySelectorAll("[data-wf-pop]").forEach(r => r.onchange = () => { s.draftPopulation = r.dataset.wfPop; s.draftItemKeys=[]; render(); });
    const searchInput = document.getElementById("wfSearchName");
    if(searchInput) searchInput.oninput = () => { s.draftSearchName = searchInput.value; render(); };
    document.querySelectorAll("[data-wf-item]").forEach(cb => cb.onchange = () => {
      const k = cb.dataset.wfItem;
      if(cb.checked){ if(!s.draftItemKeys.includes(k)) s.draftItemKeys.push(k); } else { s.draftItemKeys = s.draftItemKeys.filter(x=>x!==k); }
      render();
    });
    document.querySelectorAll("[data-wf-remove-group]").forEach(b => b.onclick = () => {
      s.groups.splice(Number(b.dataset.wfRemoveGroup), 1);
      render();
    });
    const addGroupBtn = document.getElementById("wfAddGroupBtn");
    if(addGroupBtn) addGroupBtn.onclick = () => {
      s.groups.push({ population: s.draftPopulation, itemKeys: [...s.draftItemKeys], searchName: s.draftSearchName });
      s.draftItemKeys = []; s.draftPopulation = "all"; s.draftSearchName = "";
      render();
    };
    const nextBtn = document.getElementById("wfStep2NextBtn");
    if(nextBtn) nextBtn.onclick = () => { s.step = 3; render(); };
    const skipBtn = document.getElementById("wfSkipBtn");
    if(skipBtn) skipBtn.onclick = () => { s.bypassAll = true; s.step = 3; render(); };
  }
  if(s.step===3){
    const backBtn = document.getElementById("wfBackBtn");
    if(backBtn) backBtn.onclick = () => { s.bypassAll = false; s.step = s.step-1; render(); };
    const doneBtn = document.getElementById("wfDoneBtn");
    if(doneBtn) doneBtn.onclick = () => closeModal();
    const applyBtn = document.getElementById("wfApplyGroupsBtn");
    if(applyBtn) applyBtn.onclick = async () => {
      const bibItemKeys = {};
      if(s.bypassAll){
        // No group defined — apply to every matched runner's own item
        // list exactly as it already stands from import. Skips group
        // definition entirely; still never overwrites an item that
        // already has a tracking number (enforced server-side).
        for(const r of modeRecords()){
          bibItemKeys[r.bib] = new Set(r.items.map(i => i.key || i.name));
        }
      } else {
        // Union each group's items per bib — overlapping groups (a Top 3
        // Overall runner is also an "All Finishers" runner) combine into one
        // set per person instead of being applied twice.
        for(const g of s.groups){
          const recs = workflowPopulationRecords(g.population, g.searchName);
          for(const r of recs){
            if(!bibItemKeys[r.bib]) bibItemKeys[r.bib] = new Set();
            for(const key of g.itemKeys) bibItemKeys[r.bib].add(key);
          }
        }
      }
      const payload = {};
      for(const bib in bibItemKeys) payload[bib] = [...bibItemKeys[bib]];
      s.applying = true; render();
      const res = await window.shipAPI.applyGroupItems(currentEvent.folderPath, mode, payload);
      await refreshEventData();
      s.applying = false; s.applyResult = res;
      render();
    };
    return;
  }
  const backBtn = document.getElementById("wfBackBtn");
  if(backBtn && s.step!==3) backBtn.onclick = () => { s.step = s.step-1; render(); };
}

  };

  // Shared by Save and Mark Validated — reads whatever's currently in the
  // (editable, unlocked) address inputs into the record. Mark Validated
  // must do this too: it used to skip straight to flipping the flag,
  // silently discarding anything just typed but not yet saved, then
  // re-rendering from the stale address and locking the fields — looking
  // exactly like the edit had been wiped.
  function readAddressFieldsIntoRecord(r){
    const before = { ...r.address, email: r.email };
    document.querySelectorAll("[data-addr]").forEach(inp => {
      const k = inp.dataset.addr;
      if(k==="email") r.email = inp.value.trim(); else r.address[k] = inp.value.trim();
    });
    const a = r.address;
    r.addressStatus = (a.street&&a.city&&a.state&&a.zip) ? "READY" : (a.street||a.city||a.state||a.zip) ? "ADDRESS REVIEW REQUIRED" : "MISSING ADDRESS";

  // No "shipped" checkbox — a tracking number IS the shipped signal, entered
  // by the operator (or by the tracking-import match), never auto-stamped by
  // the app just because a box got clicked.
  const tshirtSizeInput = document.getElementById("tshirtSizeInput");
  if(tshirtSizeInput) tshirtSizeInput.onchange = async () => {
    const r = records.find(x=>x.bib===selectedId && x.mode===mode);
    const it = r.items.find(i=>i.name==="T-Shirt");
    if(!it) return;
    const oldSize = it.size;
    it.size = tshirtSizeInput.value.trim();
    if(it.size===oldSize) return;
    await persistRecords();
    await logAudit("tshirt-size-edit", { bib: r.bib, oldSize, newSize: it.size });
    render();
  };
  document.querySelectorAll("[data-track-url]").forEach(a => a.onclick = (e) => {
    e.preventDefault();
    window.shipAPI.openExternal(a.dataset.trackUrl);
  });
  document.querySelectorAll("[data-ship-cell]").forEach(td => td.onclick = async () => {
    const track = td.dataset.shipTrack, date = td.dataset.shipDate, delivered = td.dataset.shipDelivered==="1", key = td.dataset.shipItem;
    const r = records.find(x=>x.bib===selectedId && x.mode===mode);
    const it = r.items.find(i=>(i.key||i.name)===key);
    if(!it) return;
    if(it.trackingNumber===track){
      it.trackingNumber = ""; it.shippedDate = ""; it.delivered = false; it.deliveredDate = ""; it.labelAddress = null;
      await window.shipAPI.unassignByTracking(track);
      await persistRecords();
      await logAudit("tracking-unassigned", { bib: r.bib, item: it.name, trackingNumber: track });
    } else {
      if(it.trackingNumber && !confirm(`${it.name} is already in shipment ${it.trackingNumber}. Move it to ${track} instead?`)) return;
      it.trackingNumber = track; it.shippedDate = date; it.delivered = delivered;
      const res = await window.shipAPI.markAssignedByTracking(track, currentEvent.folderPath, mode, r.bib, [key]);
      if(res.found){ it.delivered = res.delivered; it.deliveredDate = res.deliveredDate; it.labelAddress = res.labelAddress; }
      await persistRecords();
      await logAudit("tracking-applied", { bib: r.bib, trackingNumber: track, shippedDate: date, items: [it.name] });
    }
    detailUnassignedEntries = await window.shipAPI.unassignedEntriesForBib(currentEvent.folderPath, mode, r.bib);
    render();
  });
  const applyTrackAllBtn = document.getElementById("applyTrackAllBtn");
  if(applyTrackAllBtn) applyTrackAllBtn.onclick = async () => {
    const track = (document.getElementById("allItemsTrack").value||"").trim();
    const date = (document.getElementById("allItemsDate").value||"").trim();
    if(!track){ alert("Enter a tracking number first."); return; }
    const trackParts = track.split(",").map(s=>s.trim()).filter(Boolean);
    const badParts = trackParts.filter(p=>!isValidTrackingNumber(p));
    if(badParts.length){ alert(`Doesn't look like a real tracking number: ${badParts.join(", ")}\n\nExpected a USPS (20-22 digit), UPS ("1Z..."), or FedEx (12 or 15 digit) tracking number.`); return; }
    const r = records.find(x=>x.bib===selectedId && x.mode===mode);
    // Applies to every item on the record — narrow it down afterward with
    // the click-to-toggle Shipments table above, same as any Stamps row.
    const affectedItems = r.items;
    const affected = affectedItems.map(it=>it.name);
    const affectedKeys = affectedItems.map(it=>it.key||it.name);
    r.items.forEach(it=>{ it.trackingNumber = track; if(date) it.shippedDate = date; });
    // If this tracking # (or any of several, comma-separated) matches a real
    // Stamps history entry, mark it assigned there too — otherwise it'd keep
    // showing as unassigned in the Stamps History screen even though it's
    // already recorded here, and pull in its delivered date / label address.
    for(const num of track.split(",").map(s=>s.trim()).filter(Boolean)){
      const res = await window.shipAPI.markAssignedByTracking(num, currentEvent.folderPath, mode, r.bib, affectedKeys);
      if(res.found){
        affectedItems.forEach(it=>{ it.delivered = res.delivered; it.deliveredDate = res.deliveredDate; it.labelAddress = res.labelAddress; });
      }
    }
    await persistRecords();
    await logAudit("tracking-applied", { bib: r.bib, trackingNumber: track, shippedDate: date, items: affected });
    detailUnassignedEntries = await window.shipAPI.unassignedEntriesForBib(currentEvent.folderPath, mode, r.bib);
    render();
  };
  const addItemBtn = document.getElementById("addItemBtn");
  if(addItemBtn) addItemBtn.onclick = async () => {
    const input = document.getElementById("newItemName");
    const name = input.value.trim();
    if(!name) return;
    const trackInput = document.getElementById("newItemTrack");
    const track = (trackInput.value||"").trim();
    if(track && !isValidTrackingNumber(track)){
      alert(`Doesn't look like a real tracking number: ${track}\n\nExpected a USPS (20-22 digit), UPS ("1Z..."), or FedEx (12 or 15 digit) tracking number.`);
      return;
    }
    const date = (document.getElementById("newItemDate").value||"").trim();
    const r = records.find(x=>x.bib===selectedId && x.mode===mode);
    r.items.push({ name, batchId:null, trackingNumber:track, shippedDate:track?date:"", delivered:false });
    await persistRecords();
    await logAudit("item-added", { bib: r.bib, item: name, trackingNumber: track || undefined });
    render();
  };
}

async function doImport({ fileName } = {}){
  let filePath = null;
  if(!fileName){
    filePath = await window.shipAPI.pickSourceFile(currentEvent.folderPath);
    if(!filePath) return;
  }
  // Preview first (commit:false — nothing written yet). If this import would
  // remove records, require an explicit confirm before it actually happens.
  // Nothing destructive runs just because Import was clicked.
  const preview = fileName
    ? await window.shipAPI.importSourceFileByName(currentEvent.folderPath, fileName, false)
    : await window.shipAPI.importSourceFile(currentEvent.folderPath, filePath, false);
  if(!preview.ok){ alert(preview.error); return; }
  if(preview.summary.removedStale > 0){
    const ok = confirm(`This import will REMOVE ${preview.summary.removedStale} record(s) currently in ${mode} that aren't in this file (they have no tracking number or validation on them, so nothing is lost that matters — but this can't be undone from within the app).\n\n${preview.summary.orphanedProtected} other orphaned record(s) have tracking/validated data and will be kept + flagged instead.\n\nProceed with the import?`);
    if(!ok) return;
  }
  const result = fileName
    ? await window.shipAPI.importSourceFileByName(currentEvent.folderPath, fileName, true)
    : await window.shipAPI.importSourceFile(currentEvent.folderPath, filePath, true);
  if(!result.ok){ alert(result.error); return; }
  await refreshEventData();
  const s = result.summary;
  await logAudit("import", { sourceFile: s.sourceFile, summary: s });
  alert(`Import complete — ${s.sourceFile}\n\nSource rows: ${s.sourceRowCount}\nEligible: ${s.eligible}\nExcluded (no final result): ${s.excludedNoFinalResult}\nExcluded (inconclusive identity): ${s.excludedInconclusive}\nReady: ${s.ready}  Address required: ${s.addressRequired}  Review required: ${s.addressReview}\nMissing email: ${s.missingEmail}  Unrecognized shirt: ${s.unrecognizedShirt}\nDuplicate BIB: ${s.duplicateBib}  Duplicate email: ${s.duplicateEmail}\nGender Top 3: ${s.genderTop3}  Division Top 3: ${s.divisionTop3}\n\nThis import REPLACES the ${mode} record set:\nRemoved (no longer in this file, no shipment progress): ${s.removedStale}\nKept but flagged (orphaned, but has tracking/shipped/validated data — check the exception log): ${s.orphanedProtected}`);
  render();
}

  const overlay = document.getElementById("modalOverlay");
  if(overlay) overlay.onclick = (e) => { if(e.target===overlay) closeModal(); };
  const x = document.getElementById("modalCloseX"); if(x) x.onclick = closeModal;
  const c1 = document.getElementById("modalCloseBtn"); if(c1) c1.onclick = closeModal;
  const c2 = document.getElementById("modalCloseBtn2"); if(c2) c2.onclick = closeModal;

  if(modalState.type==="validate") bindValidateModal();
  if(modalState.type==="assignHistoryDate") bindAssignHistoryDateModal();
  if(modalState.type==="bulkManualShip") bindBulkManualShipModal();
  if(modalState.type==="shipmentWorkflow") bindShipmentWorkflowModal();
  if(modalState.type==="notify") bindNotifyModal();
  if(modalState.type==="linkCalendar") bindLinkCalendarModal();
}

function bindLinkCalendarModal(){
  const saveBtn = document.getElementById("linkCalendarSaveBtn");
  if(saveBtn) saveBtn.onclick = async () => {
    const val = document.getElementById("calendarSelect").value;
    await linkCalendarEvent(val || null);
    closeModal();
  };
}

function bindValidateModal(){
  const pending = pendingAddressRecords();
  const idx = Math.min(modalState.idx||0, Math.max(0,pending.length-1));
  const r = pending[idx];
  const skip = document.getElementById("vSkipBtn");
  if(skip) skip.onclick = () => { modalState.idx = idx+1; render(); };
  const flag = document.getElementById("vFlagReviewBtn");
  if(flag) flag.onclick = async () => {
    r.addressStatus = "ADDRESS REVIEW REQUIRED"; r.stampsValidated = false;
    await persistRecords();
    await logAudit("address-flagged-review", { bib: r.bib });
    render();
  };
  const save = document.getElementById("vSaveReadyBtn");
  if(save) save.onclick = async () => {
    const before = { ...r.address };
    document.querySelectorAll("[data-vaddr]").forEach(inp => { r.address[inp.dataset.vaddr] = inp.value.trim(); });
    const a = r.address;
    r.addressStatus = (a.street&&a.city&&a.state&&a.zip) ? "READY" : "ADDRESS REVIEW REQUIRED";
    r.stampsValidated = r.addressStatus === "READY";
    await persistRecords();
    await logAudit("address-edit", { bib: r.bib, before, after: { ...r.address }, newStatus: r.addressStatus, viaValidateQueue: true });
    render();
  };
}

function bindNotifyModal(){
  const s = modalState;
  const btn = document.getElementById("notifyConfirmBtn");
  if(btn) btn.onclick = async () => {
    let sent = 0;
    const notifiedBibs = [];
    for(const r of s.list){
      const shippedItems = r.items.filter(i=>i.trackingNumber);
      const trackLine = shippedItems.map(i=>`${i.name}: ${i.trackingNumber||"(tracking pending)"}`).join("\n");
      const res = await window.shipAPI.sendViaOutlook({
        to: r.email,
        subject: `Citytri — your shipment is on the way (${currentEvent.active||currentEvent.rsu})`,
        body: `Hi ${r.firstName},\n\nYour item(s) from ${currentEvent.active||currentEvent.rsu} (BIB ${r.bib}) have shipped:\n\n${trackLine}\n\nThanks for running with us!\nCitytri`,
        sendMode: "Display", // NEVER auto-send — every email opens as a draft; the human clicks Send in Outlook themselves. No exceptions.
      });
      if(res.ok){ sent++; notifiedBibs.push(r.bib); }
    }
    await logAudit("notify-drafts-opened", { bibs: notifiedBibs, count: sent });
    selected = new Set();
    closeModal();
    // "Opened," not "Sent" — these are drafts; nothing goes out until the
    // human clicks Send themselves in Outlook. See the incident in CHANGELOG 0.6.2.
    alert(`Opened ${sent} of ${s.list.length} notification email draft(s) in Outlook — review and click Send there.`);
  };
}

boot();
</script>
